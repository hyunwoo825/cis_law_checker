egal review it → bring the Roskomnadzor notification up to date → review how the setup integrates with headquarters' HR system.", "hrChecklist": ["Immediately confirm whether the company is registered with Roskomnadzor as a personal-data operator — if not registered, this is top priority", "Update the employee personal-data consent form and internal regulation (LNA) — specify what is collected, for what purpose, and for how long it's retained", "Confirm whether HR data is first stored on a server inside Russia (localization) — sending it to the headquarters HR system requires a cross-border transfer procedure", "Document an emergency response procedure for notifying Roskomnadzor within 24 hours of a breach", "Minimize access rights to HR data and formally appoint a responsible person by order"], "internalDocs": ["Personal data processing regulation", "Employee consent form", "Cross-border transfer documentation", "Breach response procedure"]}, "ru": {"background": "Серия крупных утечек персональных данных привела к резкому ужесточению санкций (Федеральный закон № 420-ФЗ от 30.11.2024, вступил в силу 30.05.2025). Кадровые данные (сведения о сотрудниках и кандидатах) полностью подпадают под регулирование персональных данных.", "whatChanged": "① Отсутствие уведомления Роскомнадзора о начале обработки персональных данных — штраф 100-300 тыс. ₽ (уведомление обязательно даже при одном сотруднике). ② Утечка данных 1-10 тыс. человек — 3-5 млн ₽. ③ Неуведомление об утечке в течение 24 часов — 1-3 млн ₽. ④ Повторная крупная утечка — оборотный штраф до 500 млн ₽.", "penalty": "Применяется указанная выше шкала штрафов напрямую. Те же правила действуют одинаково и при утечке из HR-системы, и при утечке обычного Excel-файла.", "process": "Составить карту потоков данных совместно с ИТ/безопасностью → провести юридическую проверку → актуализировать уведомление в Роскомнадзор → проверить структуру интеграции с HR-системой головного офиса.", "hrChecklist": ["Немедленно проверить, зарегистрирована ли компания в Роскомнадзоре как оператор персональных данных — если нет, это первоочередная задача", "Актуализировать форму согласия сотрудника на обработку персональных данных и внутреннее положение (ЛНА) — указать состав данных, цель и срок хранения", "Проверить, хранятся ли кадровые данные сначала на сервере в России (локализация) — при передаче в HR-систему головного офиса требуется процедура трансграничной передачи", "Задокументировать процедуру экстренного реагирования для уведомления Роскомнадзора в течение 24 часов после утечки", "Минимизировать права доступа к кадровым данным и назначить ответственного приказом"], "internalDocs": ["Положение об обработке персональных данных", "Форма согласия сотрудника", "Документы о трансграничной передаче", "Процедура реагирования на утечку"]}}}, {"id": "LAB-015", "category": "문서·시스템", "titleKo": "2026년 1월 인사행정 일괄 변경 — 신규 직업분류·장애인 쿼터 확대", "titleRu": "ОК 016-2025, квоты для инвалидов", "status": "시행중", "impact": "Low", "effectiveDate": "2026-01-01", "background": "행정 정비 성격의 변경 묶음.", "whatChanged": "① 직업분류코드가 구 ОК 016-94 → 신 ОК 016-2025로 교체 — 직제표·근로계약의 직위 명칭·코드 재검토 필요, ② 장애인 고용 쿼터가 지사·사무소 등 모든 분리 사업장(обособленное подразделение/separate subdivision) 단위로 적용 확대, ③ EAEU 국적자 소득에 누진세율(13~22%) 단일 적용.", "penalty": "직접 벌금은 제한적이나, 쿼터 미이행 보고 누락 시 행정 벌금.", "hrChecklist": ["직제표의 직위 코드를 신규 분류 기준으로 대조·갱신", "법인 규모가 장애인 쿼터 대상(통상 35인 이상, 지역별 상이)인지 확인", "EAEU 국적 직원 원천징수 세율 처리를 회계법인에 확인"], "internalDocs": ["직제표", "쿼터 이행 보고 서류"], "process": "회계·노무 아웃소싱사에 일괄 반영 요청 후 결과 확인", "glossary": [{"term": "обособленное подразделение", "ko": "분리 사업장 — 본점과 다른 주소의 지사·사무소", "en": "separate subdivision"}], "sources": ["https://kontur.ru/articles/4819"], "titleEn": "New job classifier OK 016-2025, disability quotas", "i18n": {"en": {"background": "A bundle of administrative housekeeping changes.", "whatChanged": "① The job classifier code switched from the old OK 016-94 to the new OK 016-2025 — job titles and codes in the staffing table and employment contracts need review. ② The disability employment quota now applies at the level of every separate subdivision (branch/office), not just the head office. ③ EAEU nationals' income is now subject to a single progressive tax rate (13-22%).", "penalty": "Direct fines are limited, but failing to report quota compliance can result in an administrative fine.", "process": "Ask your accounting/labor outsourcing firm to apply the changes in bulk, then confirm the results.", "hrChecklist": ["Cross-check and update job codes in the staffing table against the new classifier", "Confirm whether the company's size meets the disability quota threshold (typically 35+ employees, varies by region)", "Confirm withholding tax treatment for EAEU-national employees with your accounting firm"], "internalDocs": ["Staffing table", "Quota compliance reporting documents"]}, "ru": {"background": "Пакет изменений административно-технического характера.", "whatChanged": "① Классификатор профессий заменён со старого ОК 016-94 на новый ОК 016-2025 — требуется пересмотр наименований должностей и кодов в штатном расписании и трудовых договорах. ② Квота на трудоустройство инвалидов теперь применяется на уровне каждого обособленного подразделения (филиала/офиса), а не только головного офиса. ③ К доходам граждан ЕАЭС теперь применяется единая прогрессивная налоговая ставка (13-22%).", "penalty": "Прямые штрафы ограничены, но непредставление отчётности о выполнении квоты может повлечь административный штраф.", "process": "Запросить у бухгалтерского/кадрового аутсорсера комплексное применение изменений, затем проверить результат.", "hrChecklist": ["Сверить и обновить коды должностей в штатном расписании по новому классификатору", "Проверить, подпадает ли компания под порог квоты для инвалидов (обычно от 35 сотрудников, зависит от региона)", "Уточнить у бухгалтерии порядок удержания налога для сотрудников — граждан ЕАЭС"], "internalDocs": ["Штатное расписание", "Документы отчётности по выполнению квоты"]}}}, {"id": "LAB-016", "category": "문서·시스템", "titleKo": "플랫폼 경제법 — 플랫폼 통한 외주 인력 사용 규칙 신설", "titleRu": "289-ФЗ о платформенной экономике", "status": "시행예정", "impact": "Low", "effectiveDate": "2026-10-01", "background": "마켓플레이스·배달·프리랜서 플랫폼 전반을 규율하는 기본법(2025-07-31 연방법 289-ФЗ). 플랫폼 경유 자영업자(самозанятые/self-employed)·개인 도급 인력을 쓰는 회사에 영향.", "whatChanged": "'성실 플랫폼 레지스트리'에 등록된 플랫폼만 실행인력과 도급계약 중개 가능. 플랫폼의 조건 변경·제재·랭킹 규칙 공개 의무화.", "penalty": "미등록 플랫폼 경유 인력 사용 시 계약 적법성 리스크.", "hrChecklist": ["프로모터·행사 인력·배송 등 플랫폼/자영업자 경유 인력 사용 현황 파악", "사용 중인 플랫폼이 레지스트리 등록 대상인지 10월 전 확인", "자영업자 장기·상시 활용은 위장고용(переквалификация/reclassification) 리스크 — 병행 점검"], "internalDocs": ["도급·용역 계약서", "외주 인력 사용 현황"], "process": "사용 플랫폼 목록 작성 → 10월 이후 레지스트리 대조 → 문제 시 계약 구조 변경", "glossary": [{"term": "самозанятый", "ko": "자영업자(간이 과세 지위) — 상시 고용 대체 활용 시 노동관계로 재판정 리스크", "en": "samozanyaty — self-employed status"}], "sources": ["https://kurs.alfabank.ru/articles/289-fz-novye-pravila-platformennoj-zanyatosti/", "https://tusoft.ru/blog/obshee/zakon-o-platformennoj-ekonomike-chto-izmenitsya-s-1-oktyabrya-2026-goda/"], "titleEn": "Law 289-FZ on the platform economy", "i18n": {"en": {"background": "A framework law governing marketplaces, delivery, and freelance platforms broadly (Federal Law No. 289-FZ of Jul 31, 2025). Affects companies using self-employed workers or individual contractors sourced through platforms.", "whatChanged": "Only platforms listed in the \"Registry of Bona Fide Platforms\" may broker contract work with individual workers. Platforms must disclose their terms-change, penalty, and ranking rules.", "penalty": "Using workers sourced through an unregistered platform creates contract-validity risk.", "process": "Compile a list of platforms currently used → cross-check against the registry after October → restructure contracts if an issue is found.", "hrChecklist": ["Map current use of platform/self-employed workers (promoters, event staff, delivery, etc.)", "Before October, confirm whether the platforms in use are subject to registry listing", "Separately check for reclassification risk if self-employed workers are used long-term/regularly as if they were employees"], "internalDocs": ["Contractor/service agreement", "Outsourced workforce usage records"]}, "ru": {"background": "Рамочный закон, регулирующий маркетплейсы, доставку и фриланс-платформы (Федеральный закон № 289-ФЗ от 31.07.2025). Затрагивает компании, использующие самозанятых или индивидуальных исполнителей через платформы.", "whatChanged": "Только платформы, включённые в «реестр добросовестных платформ», смогут выступать посредником при заключении договоров с исполнителями. Платформы обязаны раскрывать правила изменения условий, санкций и ранжирования.", "penalty": "Использование исполнителей через незарегистрированную платформу создаёт риск недействительности договора.", "process": "Составить список используемых платформ → после октября сверить с реестром → при выявлении проблемы пересмотреть структуру договора.", "hrChecklist": ["Составить карту текущего использования исполнителей через платформы/самозанятых (промоутеры, персонал мероприятий, доставка и т.д.)", "До октября проверить, подлежат ли используемые платформы включению в реестр", "Отдельно проверить риск переквалификации при длительном/регулярном использовании самозанятых по факту как штатных сотрудников"], "internalDocs": ["Договор подряда/оказания услуг", "Учёт использования внешнего персонала"]}}}, {"id": "LAB-017", "category": "채용·해고", "titleKo": "졸업생 인턴십(стажировка) 정식 근로계약 유형 신설", "titleRu": "Закон о стажировке выпускников — новая глава ТК РФ", "titleEn": "New graduate 'internship' (stazhirovka) employment contract type", "status": "계류중", "impact": "Medium", "effectiveDate": "2027-03-01", "background": "인력난 및 청년 취업난 대응 차원에서 대통령이 ПМЭФ-2026(상트페테르부르크 국제경제포럼)에서 관련 법안의 신속 처리를 요청. 2026-07-08 국가두마 2·3독회 통과(법안번호 및 대통령 서명·연방관보 게재 절차는 확인 대기 중).", "whatChanged": "① '스타지롭카(стажировка)'를 정식 근로계약 유형으로 신설 — 전문대·대학 졸업(예정)자 또는 재교육 과정 이수(예정)자가 첫 duation. ⑥ If the same employer hires the person permanently afterward, no probationary period applies. ⑦ Does not apply to civil servants/municipal employees or to existing safety-training/licensing internships.", "penalty": "No direct penalty yet since the bill is not yet promulgated. Once in force, misclassifying a stazhirovka contract as an unpaid internship or informal arrangement risks labor-inspectorate sanctions and retroactive wage claims for disguised/unpaid employment.", "process": "Currently passed 2nd/3rd Duma reading — monitor quarterly for Federation Council approval and presidential signature/publication → once promulgated, work with a labor advisor to prepare a dedicated contract template and mentor-assignment procedure.", "hrChecklist": ["If the company runs a new-graduate hiring/internship program, review its current setup (paid status, contract type)", "Check quarterly whether the law has been promulgated (effective date targeted for 2027-03-01)", "Once confirmed, prepare a dedicated stazhirovka contract template and mentor-assignment procedure", "Notify HR and line managers in advance that unpaid-internship practices will need to be phased out"], "internalDocs": ["New-hire recruitment procedure", "Internal internship/probation policy"]}, "ru": {"background": "В целях смягчения дефицита кадров и молодёжной безработицы Президент на ПМЭФ-2026 попросил ускорить принятие данного законопроекта. Госдума приняла его во втором и третьем чтениях 08.07.2026 (одобрение Советом Федерации и подписание Президентом/публикация пока не подтверждены).", "whatChanged": "① Вводится «стажировка» как формальный вид трудового договора — срочный трудовой договор для лиц, получивших или получающих среднее профессиональное/высшее образование либо проходящих переподготовку, для получения первого профессионального опыта. ② Максимальный срок — 6 месяцев, с теми же правами, что и у обычных работников: оплата, трудовой стаж, больничный (неоплачиваемые стажировки запрещены). ③ сультируйтесь с местным юристом по трудовому праву.", "todayLabel": "Сегодня ", "tlCntTemplate": "{n} показано · {m} дата не определена"}};
const TODAY_STR = "2026-07-30";

let lang = (function(){ try { return localStorage.getItem('laborLangPref') || 'ko'; } catch(e){ return 'ko'; } })();
const impRank = {"High":3,"Medium":2,"Low":1};
let fCat = "전체", fSt = "전체";

function parseDate(s){
  const m = s && s.match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
const today = parseDate(TODAY_STR) || new Date();
today.setHours(0,0,0,0);
DATA.regulations.forEach(r => { r._date = parseDate(r.effectiveDate); });

function T(){ return UI[lang]; }
function title(r){ return lang==='ko' ? r.titleKo : (lang==='en' ? r.titleEn : r.titleRu); }
function field(r, key){ return lang==='ko' ? r[key] : r.i18n[lang][key]; }
function effDateDisplay(r){ if (lang==='ko' || !r.effectiveDateI18n) return r.effectiveDate; return r.effectiveDateI18n[lang] || r.effectiveDate; }
function catLabel(cat){ return (CATS[cat] && CATS[cat][lang]) || cat; }
function stLabel(st){ return (STATUS[st] && STATUS[st][lang]) || st; }

function setLangBar(){
  const opts = [["ko","한국어"],["en","EN"],["ru","RU"]];
  document.getElementById('langbar').innerHTML = opts.map(([code,label]) =>
    `<button class="langbtn ${lang===code?'on':''}" onclick="setLang('${code}')">${label}</button>`).join('');
}
function setLang(code){
  lang = code;
  try { localStorage.setItem('laborLangPref', code); } catch(e){}
  renderAll();
}

function renderAll(){
  setLangBar();
  document.documentElement.lang = lang;
  const t = T();
  document.getElementById('h1Title').textContent = t.pageTitle;
  document.getElementById('subLabel').innerHTML = t.subLabel + ' <span>' + t.updatedPrefix + DATA.meta.lastUpdated + '</span>';
  document.getElementById('tlSectionTitle').innerHTML = t.tlSection + ' <span class="cnt" id="tlCnt"></span>';
  document.getElementById('guideSectionTitle').textContent = t.guideSection;
  document.getElementById('guideToggleLabel').textContent = t.guideToggle;
  document.getElementById('listSectionTitle').innerHTML = t.listSection + ' <span class="cnt">' + t.sortedNote + '</span>';
  document.getElementById('sectionUpcomingTitle').innerHTML = t.sectionUpcoming + ' <span class="cnt" id="upcomingCnt"></span>';
  document.getElementById('sectionActiveTitle').innerHTML = t.sectionActive + ' <span class="cnt" id="activeCnt"></span>';
  document.getElementById('tbdTitle').textContent = t.tbdTitle;
  document.getElementById('empty').textContent = t.emptyState;
  document.getElementById('footerText').textContent = t.footer;
  document.getElementById('tlLegend').innerHTML =
    '<span><i style="background:#e5484d"></i>' + t.impactLabel + ' High</span>' +
    '<span><i style="background:#f59e0b"></i>' + t.impactLabel + ' Medium</span>' +
    '<span><i style="background:#94a3b8"></i>' + t.impactLabel + ' Low</span>' +
    '<span style="opacity:.55">' + t.pastDotNote + '</span>';

  renderSummary();
  renderTimeline();
  renderGuide();
  renderFilters();
  renderCards();
}

function renderSummary(){
  const stCounts = {};
  DATA.regulations.forEach(r => stCounts[r.status] = (stCounts[r.status]||0)+1);
  document.getElementById('sumrow').innerHTML =
    ['시행중','시행예정','계류중','논의중'].map(s =>
      `<div class="sumchip"><div class="n">${stCounts[s]||0}</div><div class="l">${stLabel(s)}</div></div>`).join('');
}

function renderTimeline(){
  const dated = DATA.regulations.filter(r => r._date);
  const tbd = DATA.regulations.filter(r => !r._date);
  document.getElementById('tlCnt').textContent = T().tlCntTemplate.replace('{n}', dated.length).replace('{m}', tbd.length);

  let minD, maxD;
  if (dated.length){
    minD = new Date(Math.min(today, ...dated.map(r=>r._date.getTime())));
    maxD = new Date(Math.max(today, ...dated.map(r=>r._date.getTime())));
  } else { minD = new Date(today); maxD = new Date(today); }
  minD = new Date(minD.getFullYear(), minD.getMonth()-1, 1);
  maxD = new Date(maxD.getFullYear(), maxD.getMonth()+2, 1);
  const span = maxD - minD;
  function xPos(d){ return ((d - minD) / span) * 100; }

  const ticks = [];
  let cur = new Date(minD.getFullYear(), Math.floor(minD.getMonth()/3)*3, 1);
  while (cur <= maxD){ ticks.push(new Date(cur)); cur = new Date(cur.getFullYear(), cur.getMonth()+3, 1); }

  const byDate = {};
  dated.forEach(r => { const k = r._date.toISOString().slice(0,10); (byDate[k] = byDate[k] || []).push(r); });

  let tl = '';
  tl += `<div class="tl-axis"></div>`;
  ticks.forEach(t => {
    const x = xPos(t);
    tl += `<div class="tl-tick" style="left:${x}%"></div>`;
    tl += `<div class="tl-tick-label" style="left:${x}%">${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}</div>`;
  });
  const todayX = xPos(today);
  tl += `<div class="tl-today" style="left:${todayX}%"></div>`;
  tl += `<div class="tl-today-label" style="left:${todayX}%">${T().todayLabel}${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}</div>`;

  Object.keys(byDate).forEach(k => {
    const group = byDate[k].sort((a,b)=>impRank[b.impact]-impRank[a.impact]);
    const d = group[0]._date;
    const x = xPos(d);
    const isPast = d < today;
    group.forEach((r, i) => {
      const dy = i * 17;
      tl += `<div class="tl-ev" style="left:${x}%; top:${dy}px" onclick="openCard('${r.id}')" title="${title(r)} (${stLabel(r.status)}, ${T().impactLabel} ${r.impact}, ${r.effectiveDate})">
        <div class="tl-dot ${r.impact} ${isPast?'past':''}"></div>
      </div>`;
    });
    const labelY = 20 + (group.length-1)*17;
    tl += `<div class="tl-dlabel ${isPast?'pastl':'future'}" style="left:${x}%; top:${labelY}px">${d.getMonth()+1}/${d.getDate()}${!isPast ? ' · D-'+Math.round((d-today)/86400000) : ''}</div>`;
  });

  document.getElementById('tlInner').innerHTML = tl;
  document.getElementById('tlInner').style.height = (100 + Math.max(...Object.values(byDate).map(g=>g.length),1)*17) + 'px';

  document.getElementById('tbdChips').innerHTML = tbd.length ? tbd.map(r =>
    `<div class="tbd-chip" onclick="openCard('${r.id}')"><b>${stLabel(r.status)}</b> · ${title(r)} <span style="color:#9aa3ad">(${effDateDisplay(r)})</span></div>`
  ).join('') : '';
}

function renderGuide(){
  const g = lang==='ko' ? DATA.basicsGuide : DATA.basicsGuide.i18n[lang];
  document.getElementById('guideIntro').textContent = g.intro;
  document.getElementById('guideKp').innerHTML = g.keyPoints.map(k =>
    `<div class="kp-item"><b>${k.title}</b><p>${k.desc}</p></div>`).join('');
}

function renderFilters(){
  const cats = ["전체", ...new Set(DATA.regulations.map(r => r.category))];
  const sts = ["전체","시행중","시행예정","계류중","논의중"];
  document.getElementById('catFilters').innerHTML = cats.map(c =>
    `<button class="fbtn ${fCat===c?'on':''}" onclick="fCat='${c}';renderFilters();renderCards()">${c==="전체"?T().filterAll:catLabel(c)}</button>`).join('');
  document.getElementById('stFilters').innerHTML = sts.map(s =>
    `<button class="fbtn ${fSt===s?'on':''}" onclick="fSt='${s}';renderFilters();renderCards()">${s==="전체"?T().filterAll:stLabel(s)}</button>`).join('');
}

function blk(t, inner){ return inner ? `<div class="blk"><div class="blk-t">${t}</div>${inner}</div>` : ''; }

function cardHtml(r){
  const t = T();
  const bg = field(r,'background'), wc = field(r,'whatChanged'), pen = field(r,'penalty'),
        proc = field(r,'process'), checks = field(r,'hrChecklist'), docs = field(r,'internalDocs');
  const showGlossary = lang !== 'ru' && r.glossary && r.glossary.length;
  const glossHtml = showGlossary ? r.glossary.map(g => {
    if (lang === 'en') return `<span><b>${g.term}</b>${g.en ? ' — '+g.en : ''}</span>`;
    return `<span><b>${g.term}</b>${g.en ? ` (${g.en})` : ''} — ${g.ko}</span>`;
  }).join('') : '';
  return `
  <div class="card imp-${r.impact}" id="card-${r.id}">
    <div class="card-head" onclick="this.parentElement.classList.toggle('open')">
      <div class="chrow">
        <span class="badge b-cat">${catLabel(r.category)}</span>
        <span class="badge ${({"시행중":"b-st-active","시행예정":"b-st-planned","계류중":"b-st-pending","논의중":"b-st-disc"})[r.status]||'b-st-disc'}">${stLabel(r.status)}</span>
        <span class="badge b-imp-${r.impact}">${t.impactLabel} ${r.impact}</span>
        ${r._date && r._date >= today ? `<span class="badge b-dday">D-${Math.round((r._date-today)/86400000)}</span>` : ''}
        <span class="chev">▶</span>
      </div>
      <div class="ct">${title(r)}</div>
      <div class="cru">${lang==='ko' ? (r.titleRu + (r.titleEn?` · <span style="color:#0f766e">${r.titleEn}</span>`:'')) : (lang==='en' ? r.titleRu : r.titleEn)}</div>
      <div class="cdate">${lang==='ko'?'시행':(lang==='en'?'Effective':'Вступление в силу')}: ${effDateDisplay(r)}</div>
    </div>
    <div class="card-body">
      ${blk(t.blkBackground, `<p>${bg}</p>`)}
      ${blk(t.blkWhatChanged, `<p>${wc}</p>`)}
      ${blk(t.blkChecklist, `<ul class="checks">${checks.map(c=>`<li>${c}</li>`).join('')}</ul>`)}
      ${blk(t.blkDocs, `<ul class="docs">${docs.map(d=>`<li>${d}</li>`).join('')}</ul>`)}
      ${blk(t.blkProcess, `<div class="proc">${proc}</div>`)}
      ${blk(t.blkPenalty, `<div class="pen">${pen}</div>`)}
      ${showGlossary ? blk(t.blkGlossary, `<div class="gl">${glossHtml}</div>`) : ''}
      ${blk(t.blkSources, `<div class="srcs">${r.sources.map(s=>`<a href="${s}" target="_blank">${s}</a>`).join('')}</div>`)}
    </div>
  </div>`;
}

function renderCards(){
  const filtered = DATA.regulations.filter(r =>
    (fCat==="전체"||r.category===fCat) && (fSt==="전체"||r.status===fSt));

  const active = filtered.filter(r => r.status === "시행중")
    .sort((a,b) => impRank[b.impact]-impRank[a.impact] || (b._date?b._date.getTime():-Infinity) - (a._date?a._date.getTime():-Infinity));

  const upcoming = filtered.filter(r => r.status !== "시행중")
    .sort((a,b) => impRank[b.impact]-impRank[a.impact] || (a._date?a._date.getTime():Infinity) - (b._date?b._date.getTime():Infinity));

  document.getElementById('activeCnt').textContent = active.length + (lang==='ko' ? '건' : '');
  document.getElementById('upcomingCnt').textContent = upcoming.length + (lang==='ko' ? '건' : '');
  document.getElementById('activeCards').innerHTML = active.map(cardHtml).join('');
  document.getElementById('upcomingCards').innerHTML = upcoming.map(cardHtml).join('');
  document.getElementById('empty').style.display = (active.length + upcoming.length) ? 'none' : 'block';
}

function openCard(id){
  fCat = "전체"; fSt = "전체"; renderFilters(); renderCards();
  const el = document.getElementById('card-'+id);
  if (el){ el.classList.add('open'); el.scrollIntoView({behavior:'smooth', block:'start'}); }
}

renderAll();
</script>
</body>
</html>
