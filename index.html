<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>러시아 노동법 Checker</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
  background: #f6f7f9; color: #1a1d21; line-height: 1.55; padding: 20px;
}
.wrap { max-width: 1040px; margin: 0 auto; }
header { margin-bottom: 18px; position: relative; }
.langbar { position:absolute; top:0; right:0; display:flex; gap:4px; background:#fff; border:1px solid #e2e6ea; border-radius:99px; padding:3px; }
.langbtn { border:none; background:transparent; border-radius:99px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:#6b7280; }
.langbtn.on { background:#0f766e; color:#fff; }
h1 { font-size: 22px; font-weight: 700; padding-right:150px; }
.sub { color: #6b7280; font-size: 13px; margin-top: 4px; }
.section-title { font-size: 14px; font-weight: 700; color:#374151; margin: 24px 0 10px; text-transform: uppercase; letter-spacing: .04em; display:flex; align-items:center; gap:8px; }
.section-title .cnt { background:#eef2f5; color:#475569; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; text-transform:none; letter-spacing:normal; }

.sumrow { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.sumchip { background:#fff; border:1px solid #e6e8eb; border-radius:10px; padding:10px 16px; flex:1; min-width:110px; }
.sumchip .n { font-size:20px; font-weight:800; }
.sumchip .l { font-size:12px; color:#6b7280; margin-top:2px; }

.tl-wrap { background:#fff; border:1px solid #e6e8eb; border-radius:12px; padding:44px 28px 46px; position:relative; overflow-x:auto; }
.tl-inner { position:relative; min-width:760px; height:150px; }
.tl-axis { position:absolute; left:0; right:0; top:75px; height:2px; background:#e2e6ea; }
.tl-tick { position:absolute; top:69px; width:1px; height:13px; background:#d1d5db; }
.tl-tick-label { position:absolute; top:88px; transform:translateX(-50%); font-size:10.5px; color:#9aa3ad; white-space:nowrap; }
.tl-today { position:absolute; top:8px; bottom:8px; width:2px; background:#e5484d; z-index:5; }
.tl-today-label { position:absolute; top:-8px; transform:translateX(-50%); background:#e5484d; color:#fff; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; }
.tl-ev { position:absolute; top:75px; cursor:pointer; }
.tl-dot { position:absolute; left:50%; transform:translate(-50%,-50%); width:13px; height:13px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.08); z-index:3; }
.tl-dot.High { background:#e5484d; } .tl-dot.Medium { background:#f59e0b; } .tl-dot.Low { background:#94a3b8; }
.tl-dot.past { opacity:.42; }
.tl-ev:hover .tl-dot { transform:translate(-50%,-50%) scale(1.45); box-shadow:0 0 0 4px rgba(15,118,110,.15); }
.tl-dlabel { position:absolute; left:50%; transform:translateX(-50%); font-size:9.5px; font-weight:700; white-space:nowrap; }
.tl-dlabel.future { color:#0f766e; }
.tl-dlabel.pastl { color:#9aa3ad; }
.tl-legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; font-size:11.5px; color:#6b7280; }
.tl-legend span { display:inline-flex; align-items:center; gap:5px; }
.tl-legend i { width:9px; height:9px; border-radius:50%; display:inline-block; }
.tbd-row { margin-top:14px; padding-top:12px; border-top:1px dashed #e5e7eb; }
.tbd-title { font-size:11.5px; color:#9aa3ad; margin-bottom:7px; }
.tbd-chips { display:flex; flex-wrap:wrap; gap:7px; }
.tbd-chip { font-size:12px; background:#f8fafc; border:1px solid #eef0f2; border-radius:99px; padding:5px 12px; cursor:pointer; color:#374151; }
.tbd-chip:hover { background:#f1f5f9; }
.tbd-chip b { color:#0f766e; }

.guide { background:#fff; border:1px solid #e6e8eb; border-radius:12px; overflow:hidden; }
.guide-head { padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; }
.guide-head:hover { background:#fafafa; }
.guide-body { display:none; padding:0 16px 16px; }
.guide.open .guide-body { display:block; }
.guide-intro { font-size:13.5px; color:#374151; background:#f8fafc; border-radius:8px; padding:12px 14px; margin-bottom:12px; }
.kp { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px; }
.kp-item { border:1px solid #eef0f2; border-radius:8px; padding:10px 12px; }
.kp-item b { font-size:13px; color:#0f766e; }
.kp-item p { font-size:12.5px; color:#4b5563; margin-top:4px; }
.chev { transition:transform .15s; font-size:12px; color:#9ca3af; margin-left:auto; }
.open > .guide-head .chev, .card.open .chev { transform:rotate(90deg); }

.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.fbtn { border:1px solid #d1d5db; background:#fff; border-radius:99px; padding:5px 13px; font-size:12.5px; cursor:pointer; color:#374151; }
.fbtn.on { background:#0f766e; border-color:#0f766e; color:#fff; }

.card { background:#fff; border:1px solid #e6e8eb; border-radius:12px; margin-bottom:12px; overflow:hidden; }
.card.imp-High { border-left:4px solid #e5484d; }
.card.imp-Medium { border-left:4px solid #f59e0b; }
.card.imp-Low { border-left:4px solid #cbd5e1; }
.card-head { padding:14px 16px; cursor:pointer; }
.card-head:hover { background:#fafafa; }
.chrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.badge { font-size:11px; font-weight:700; padding:2.5px 8px; border-radius:99px; white-space:nowrap; }
.b-cat { background:#eef2ff; color:#3730a3; }
.b-st-active { background:#dcfce7; color:#166534; }
.b-st-planned { background:#fef3c7; color:#92400e; }
.b-st-pending { background:#e0e7ff; color:#3730a3; }
.b-st-disc { background:#f3f4f6; color:#4b5563; }
.b-imp-High { background:#fde7e7; color:#c11; }
.b-imp-Medium { background:#fff3e0; color:#b45309; }
.b-imp-Low { background:#eef2f5; color:#475569; }
.b-dday { background:#111827; color:#fff; }
.ct { font-size:15px; font-weight:700; margin-top:7px; }
.cru { font-size:12px; color:#6b7280; margin-top:2px; }
.cdate { font-size:12px; color:#0f766e; font-weight:600; margin-top:4px; }
.card-body { display:none; padding:0 16px 16px; border-top:1px solid #f3f4f6; }
.card.open .card-body { display:block; }
.blk { margin-top:14px; }
.blk-t { font-size:12px; font-weight:800; color:#0f766e; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
.blk p { font-size:13.5px; color:#374151; }
.blk ul { margin:0; padding-left:0; list-style:none; }
.blk ul li { font-size:13.5px; color:#374151; padding:5px 0 5px 26px; position:relative; }
.blk ul.checks li::before { content:"☐"; position:absolute; left:4px; color:#0f766e; font-weight:700; }
.blk ul.docs li::before { content:"📄"; position:absolute; left:0; font-size:12px; }
.proc { background:#f8fafc; border-radius:8px; padding:10px 12px; font-size:13px; color:#374151; }
.pen { background:#fff5f5; border-left:3px solid #e5484d; border-radius:6px; padding:9px 12px; font-size:13px; color:#7f1d1d; }
.gl { display:flex; flex-wrap:wrap; gap:6px; }
.gl span { font-size:12px; background:#f3f4f6; border-radius:6px; padding:4px 9px; color:#4b5563; }
.gl b { color:#111827; }
.srcs a { font-size:12px; color:#2563eb; text-decoration:none; display:block; padding:2px 0; word-break:break-all; }
.srcs a:hover { text-decoration:underline; }
footer { margin-top:26px; font-size:11.5px; color:#9ca3af; text-align:center; }
.empty { text-align:center; color:#9ca3af; font-size:13px; padding:30px 0; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="langbar" id="langbar"></div>
  <h1 id="h1Title"></h1>
  <div class="sub" id="subLabel"></div>
  <div class="sumrow" id="sumrow"></div>
</header>

<div class="section-title" id="tlSectionTitle"></div>
<div class="tl-wrap">
  <div class="tl-inner" id="tlInner"></div>
  <div class="tl-legend" id="tlLegend"></div>
  <div class="tbd-row">
    <div class="tbd-title" id="tbdTitle"></div>
    <div class="tbd-chips" id="tbdChips"></div>
  </div>
</div>

<div class="section-title" id="guideSectionTitle"></div>
<div class="guide" id="guide">
  <div class="guide-head" onclick="this.parentElement.classList.toggle('open')">
    <span id="guideToggleLabel"></span>
    <span class="chev">▶</span>
  </div>
  <div class="guide-body">
    <div class="guide-intro" id="guideIntro"></div>
    <div class="kp" id="guideKp"></div>
  </div>
</div>

<div class="section-title" id="listSectionTitle"></div>
<div class="filters" id="catFilters"></div>
<div class="filters" id="stFilters"></div>

<div class="section-title" style="margin-top:20px" id="sectionUpcomingTitle"></div>
<div id="upcomingCards"></div>

<div class="section-title" id="sectionActiveTitle"></div>
<div id="activeCards"></div>

<div class="empty" id="empty" style="display:none"></div>

<footer id="footerText"></footer>
</div>

<script>
const DATA = {"meta": {"title": "러시아 노동법 Checker — HR용", "audience": "러시아 법인 한국인 인사총괄 (러시아법 배경지식 없음 전제)", "lastUpdated": "2026-07-30", "note": "한글 기본 + 러시아어 용어는 영어 병기(러시아어/English). 출처는 각 항목 sources 참조.", "statusLegend": {"시행중": "이미 발효되어 지금 준수해야 하는 규정", "시행예정": "법률 공포 완료, 발효일이 미래", "계류중": "국가두마(Госдума/State Duma) 심의 중인 법안", "논의중": "발의 예정 또는 초기 논의 단계"}}, "basicsGuide": {"intro": "러시아 노동관계는 노동법전(Трудовой кодекс РФ/Labor Code, 약칭 ТК РФ/Labor Code)이 기본법이며, 한국 근로기준법보다 절차 형식주의가 강합니다. 문서(서면 동의·приказ/prikaz/order·규정) 없이는 어떤 인사 조치도 유효하지 않다고 보는 것이 안전합니다.", "keyPoints": [{"title": "ЛНА / LNA — Local Normative Acts (로컬 규범문서)", "desc": "취업규칙(ПВТР/PVTR), 보수규정, 개인정보규정 등 회사 내부 규정. 러시아에서는 법이 바뀌면 ЛНА/LNA를 개정하고 직원 서명(ознакомление под подпись/sign-off by employee)을 받아야 효력이 생김. 법 개정 대응의 80%는 ЛНА 개정 작업."}, {"title": "ГИТ / GIT — State Labor Inspectorate (국가노동감독청)", "desc": "한국 고용노동부 근로감독관에 해당. Роструд/Rostrud 산하. 직원 신고 기반 조사 비중이 높고, 문서 미비만으로도 벌금 부과."}, {"title": "приказ / prikaz — HR Order (인사명령서)", "desc": "채용·해고·휴가·담당자 지정 등 모든 인사 조치는 서면 приказ로 발행하고 직원 서명을 받는 것이 원칙."}, {"title": "КЭДО / KEDO — HR e-Document System (인사 전자문서시스템)", "desc": "인사 문서를 전자서명으로 처리하는 제도. 도입하려면 별도 규정 제정 + 직원 개별 서면 동의 필요."}, {"title": "МРОТ / MROT — Minimum Wage (최저임금)", "desc": "연방 최저임금. 모스크바 등 지역은 별도의 더 높은 지역 최저임금이 있으므로 항상 지역 기준으로 점검."}, {"title": "воинский учёт / voinsky uchyot — Military Registration (병역 등록)", "desc": "모든 법인은 러시아인 병역 대상 직원의 명부를 관리하고 군사위원회(военкомат/voenkomat)에 보고할 의무가 있음. 외국인 직원은 대상 아님."}, {"title": "ВКС / VKS — Highly Qualified Specialist (고급전문인력)", "desc": "Высококвалифицированный специалист. 분기당 75만 루블 이상 급여 요건을 충족하는 외국인 전문가 제도. 한국인 주재원 대부분이 이 지위로 근무. 쿼터 면제·3년 워크퍼밋."}, {"title": "협의 라인 기본 순서", "desc": "① 현지 노무·법무 자문사(또는 사내 법무)에 해석 확인 → ② 본사 HR·법무에 리스크 보고 → ③ ЛНА·계약서 개정안 작성 → ④ 직원 통지·서명 → ⑤ 시행 및 기록 보관. 급여 관련은 회계법인(아웃소싱 시) 병행 협의."}], "i18n": {"en": {"intro": "Russian labor relations are governed primarily by the Labor Code (TK RF), which follows procedural formalities much more strictly than Korea's Labor Standards Act. It's safest to assume that no HR action is valid without documentation (written consent, a prikaz, or an internal regulation).", "keyPoints": [{"title": "LNA — Local Normative Acts", "desc": "Internal company regulations such as internal labor rules (PVTR), pay regulations, and personal-data regulations. In Russia, whenever a law changes, the LNA must be amended and signed off by each employee to take effect. About 80% of responding to a legal change is amending an LNA."}, {"title": "GIT — State Labor Inspectorate", "desc": "Equivalent to Korea's Ministry of Employment and Labor inspectors, operating under Rostrud. Most investigations are triggered by employee complaints, and missing documentation alone is enough to draw a fine."}, {"title": "Prikaz — HR Order", "desc": "The rule of thumb: every HR action — hiring, dismissal, leave, appointing a responsible person — must be issued as a written order and signed by the employee."}, {"title": "KEDO — HR e-Document System", "desc": "A system for handling HR documents via electronic signature. Adopting it requires establishing a dedicated regulation plus individual written consent from each employee."}, {"title": "MROT — Minimum Wage", "desc": "The federal minimum wage. Moscow and other regions set their own, higher regional minimum, so always check the regional figure."}, {"title": "Voinsky Uchyot — Military Registration", "desc": "Every legal entity must maintain a roster of Russian employees subject to military registration and report to the military commissariat (voenkomat). Foreign employees are not covered."}, {"title": "VKS — Highly Qualified Specialist", "desc": "A status for foreign professionals meeting a minimum salary of RUB 750,000 per quarter. Most Korean expatriates work under this status — it's quota-exempt with a 3-year work permit."}, {"title": "Standard consultation sequence", "desc": "① Confirm interpretation with a local labor/legal advisor (or in-house legal) → ② report the risk to HQ HR/Legal → ③ draft the LNA/contract amendment → ④ notify employees and collect signatures → ⑤ implement and keep records. For pay-related matters, coordinate in parallel with your outsourced accounting firm."}]}, "ru": {"intro": "Трудовые отношения в России регулируются прежде всего Трудовым кодексом РФ (ТК РФ), который гораздо строже относится к процедурному оформлению, чем корейское трудовое законодательство. Безопаснее исходить из того, что ни одно кадровое решение не имеет силы без документального оформления (письменное согласие, приказ, локальный акт).", "keyPoints": [{"title": "ЛНА — локальные нормативные акты", "desc": "Внутренние документы компании: ПВТР, положение об оплате труда, положение о персональных данных и др. В России при изменении закона необходимо внести изменения в ЛНА и ознакомить с ними каждого сотрудника под подпись, чтобы они вступили в силу. Около 80% реагирования на изменение законодательства — это работа с ЛНА."}, {"title": "ГИТ — Государственная инспекция труда", "desc": "Аналог трудовой инспекции в Корее, подчиняется Роструду. Большинство проверок инициируется по жалобам работников, и одного лишь отсутствия документации достаточно для штрафа."}, {"title": "Приказ — кадровый распорядительный документ", "desc": "Общее правило: любое кадровое решение — приём, увольнение, отпуск, назначение ответственного лица — оформляется письменным приказом с ознакомлением сотрудника под подпись."}, {"title": "КЭДО — система кадрового электронного документооборота", "desc": "Система оформления кадровых документов с электронной подписью. Для внедрения требуется утверждение отдельного положения и индивидуальное письменное согласие каждого сотрудника."}, {"title": "МРОТ — минимальный размер оплаты труда", "desc": "Федеральный минимальный размер оплаты труда. В Москве и других регионах действует свой, более высокий региональный МРОТ — всегда проверяйте региональный показатель."}, {"title": "Воинский учёт", "desc": "Каждое юрлицо обязано вести учёт военнообязанных сотрудников-граждан РФ и отчитываться перед военкоматом. Иностранные сотрудники учёту не подлежат."}, {"title": "ВКС — высококвалифицированный специалист", "desc": "Статус для иностранных специалистов с зарплатой не менее 750 000 ₽ в квартал. Большинство корейских командированных сотрудников работают в этом статусе — он не подпадает под квоту и даёт разрешение на работу сроком на 3 года."}, {"title": "Стандартная последовательность согласования", "desc": "① Уточнить толкование у местного консультанта по трудовому праву (или юротдела) → ② доложить о риске HR/юротделу головного офиса → ③ подготовить проект изменений ЛНА/договора → ④ уведомить сотрудников и собрать подписи → ⑤ внедрить и сохранить документы. Вопросы, связанные с оплатой труда, согласовывать параллельно с аутсорсинговой бухгалтерией."}]}}}, "regulations": [{"id": "LAB-001", "category": "급여·보상", "titleKo": "2026년 연방 최저임금(МРОТ) 20.7% 인상", "titleRu": "МРОТ с 1 января 2026 — 27 093 ₽", "status": "시행중", "impact": "High", "effectiveDate": "2026-01-01", "background": "정부가 2030년까지 최저임금을 단계적으로 크게 올리는 정책 기조. 2026년 인상폭(+20.7%)이 특히 큼.", "whatChanged": "연방 МРОТ/MROT가 22,440루블 → 27,093루블로 인상. 풀타임 근무자의 월 급여(세전)는 이 금액 미만이 될 수 없음. 모스크바는 별도의 더 높은 지역 최저임금이 적용되므로 지역 기준 확인 필수. 부가 변화: 무급 대표(급여 없는 법인장)에 대해서도 МРОТ 기준 사회보험료 납부 의무 신설.", "penalty": "МРОТ 미달 지급 시 КоАП/Admin. Offenses Code 5.27조 벌금(법인 최대 5만₽/건) + 차액 소급 지급. 반복 시 가중.", "hrChecklist": ["전 직원 급여 테이블에서 세전 기본급이 모스크바 지역 최저임금 이상인지 일괄 점검", "파트타임·단시간 근무자는 근무시간 비례 기준으로 재계산", "보수규정(Положение об оплате труда/Pay Regulation)의 최저 등급 급여 갱신", "급여 아웃소싱 회계법인에 2026년 기준 반영 여부 서면 확인"], "internalDocs": ["보수규정(Положение об оплате труда)", "штатное расписание/staffing table(직제표)", "근로계약서 급여 조항"], "process": "회계법인에 현재 급여 하한 검증 요청 → 미달자 발견 시 допсоглашение/supplementary agreement(계약 변경 합의서) 체결 → 본사에 인건비 영향 보고", "glossary": [{"term": "штатное расписание", "ko": "직제표 — 직위·급여를 명시한 필수 인사문서", "en": "staffing table"}], "sources": ["https://kontur.ru/articles/4819", "https://konsugroup.com/en/news/changes-minimal-wage-regional-practice-2026/"], "titleEn": "MROT (minimum wage) from Jan 1, 2026 — RUB 27,093", "i18n": {"en": {"background": "The government's policy is to raise the minimum wage significantly in stages through 2030. The 2026 increase (+20.7%) is especially large.", "whatChanged": "The federal minimum wage (MROT) rose from RUB 22,440 to RUB 27,093. Full-time employees' monthly pay (before tax) cannot fall below this amount. Moscow applies its own higher regional minimum wage, so always check the regional figure. Additional change: unpaid general directors (with no salary) are now also subject to mandatory social insurance contributions calculated on the MROT base.", "penalty": "Paying below MROT triggers a fine under Administrative Offenses Code Art. 5.27 (up to RUB 50,000 per violation for the company) plus retroactive payment of the shortfall. Penalties increase for repeat violations.", "process": "Ask your accounting/payroll provider to verify the current pay floor → if anyone falls short, sign a supplementary agreement with them → report the payroll cost impact to headquarters.", "hrChecklist": ["Check that every employee's pre-tax base salary meets or exceeds the Moscow regional minimum wage", "Recalculate part-time/reduced-hour staff on a pro-rata basis", "Update the minimum grade salary in the Pay Regulation (Положение об оплате труда)", "Get written confirmation from your outsourced payroll firm that the 2026 threshold has been applied"], "internalDocs": ["Pay Regulation (Положение об оплате труда)", "Staffing table (штатное расписание)", "Salary clause of the employment contract"]}, "ru": {"background": "Правительство проводит политику поэтапного значительного повышения МРОТ до 2030 года. Рост в 2026 году (+20,7%) особенно велик.", "whatChanged": "Федеральный МРОТ вырос с 22 440 ₽ до 27 093 ₽. Месячная зарплата (до налогов) работника на полной ставке не может быть ниже этой суммы. В Москве действует отдельный, более высокий региональный МРОТ — всегда проверяйте региональный показатель. Дополнительное изменение: за директоров без зарплаты теперь также обязательны страховые взносы, рассчитанные исходя из МРОТ.", "penalty": "Выплата зарплаты ниже МРОТ влечёт штраф по ст. 5.27 КоАП РФ (до 50 000 ₽ за нарушение для юрлица) плюс доплату разницы задним числом. При повторном нарушении штраф увеличивается.", "process": "Запросить у бухгалтерии/аутсорсера проверку текущего минимума зарплат → при обнаружении несоответствия оформить допсоглашение → доложить головному офису о влиянии на ФОТ.", "hrChecklist": ["Проверить, что базовый оклад (до налога) каждого сотрудника не ниже регионального МРОТ Москвы", "Пересчитать зарплату сотрудников на неполной занятости пропорционально отработанному времени", "Обновить минимальный оклад по разрядам в Положении об оплате труда", "Получить письменное подтверждение от аутсорсера по зарплате о применении норматива 2026 года"], "internalDocs": ["Положение об оплате труда", "Штатное расписание", "Раздел трудового договора об оплате труда"]}}}, {"id": "LAB-002", "category": "급여·보상", "titleKo": "보너스 감액·미지급 규제 강화 (프리미엄 규정 의무화)", "titleRu": "Новые правила премирования и депремирования (144-ФЗ)", "status": "시행중", "impact": "High", "effectiveDate": "2025-09-01", "background": "헌법재판소가 2023년 '회사 마음대로 보너스를 깎는 관행'을 위헌으로 판단(판결 32-П). 이를 반영해 노동법전 135조가 개정됨(2025-06-07 연방법 144-ФЗ).", "whatChanged": "① 보너스의 종류·금액·지급 조건·미지급 사유를 회사 내부 규정(ЛНА/LNA)에 명확히 정해야 함. ② 징계를 이유로 한 보너스 감액은 '징계가 발생한 그 달'에만 가능(분기·연간 보너스 전체 박탈 불가). ③ 감액하더라도 해당 월 총급여의 20%를 초과해 줄일 수 없음.", "penalty": "규정 없이 임의 감액 시 노동분쟁 패소 + 미지급분 지급명령 + ГИТ/GIT 벌금. 임금 관련 위반은 벌금 인상 법안(LAB-007)의 주요 타깃.", "hrChecklist": ["보수규정·보너스규정에 지급 기준(KPI, 산정식, 지급 시기, 미지급 사유)이 구체적으로 명시돼 있는지 점검", "'회사 재량으로 지급할 수 있다' 같은 모호한 문구 삭제·교체", "징계-보너스 연계 조항이 '해당 월, 20% 한도' 원칙에 맞는지 확인", "영업 인센티브 제도가 있다면 산정 기준 문서화 여부 별도 점검"], "internalDocs": ["보너스규정(Положение о премировании/Bonus Regulation)", "보수규정", "근로계약서 보수 조항"], "process": "현행 보너스규정을 노무 자문사에 리걸 체크 의뢰 → 개정안 작성 → 직원 서명 공지 → 이후 감액 건은 반드시 서면 근거(징계 приказ/prikaz/order) 확보 후 실행", "glossary": [{"term": "депремирование", "ko": "보너스 감액·미지급 조치", "en": "bonus withdrawal"}], "sources": ["https://pravovest-audit.ru/nashi-statii-nalogi-i-buhuchet/novyy-poryadok-premirovaniya-i-depremirovaniya-rabotnikov/", "https://www.pro-ability.ru/article_hr/tpost/n8ug8gup21-novie-pravila-premirovaniya-fz-144-fz-ot"], "titleEn": "New rules on bonuses & bonus withdrawal (Law 144-FZ)", "i18n": {"en": {"background": "In 2023 the Constitutional Court ruled that letting companies cut bonuses at their own discretion was unconstitutional (Ruling No. 32-P). Article 135 of the Labor Code was amended accordingly (Federal Law No. 144-FZ of June 7, 2025).", "whatChanged": "① The types, amounts, payment conditions, and grounds for withholding bonuses must be clearly defined in an internal company regulation (LNA). ② A bonus can only be reduced for the specific month in which the disciplinary infraction occurred (a full quarterly or annual bonus can no longer be forfeited). ③ Even when reduced, the cut cannot exceed 20% of that month's total pay.", "penalty": "Cutting bonuses without a documented basis leads to losing labor disputes, an order to pay the withheld amount, plus a fine from the State Labor Inspectorate (GIT). Wage-related violations are a key target of the pending fine-increase bill (LAB-007).", "process": "Have a labor law advisor review the current bonus regulation for legal compliance → draft an amended version → announce it and collect employee signatures → from then on, any bonus reduction must be backed by a written disciplinary order (prikaz) before it is applied.", "hrChecklist": ["Check that the pay/bonus regulation specifies concrete payment criteria (KPIs, calculation formula, payment timing, grounds for non-payment)", "Remove or replace vague wording such as \"may be paid at the company's discretion\"", "Confirm the disciplinary-bonus linkage clause follows the \"same month, 20% cap\" rule", "If a sales incentive scheme exists, separately verify its calculation basis is documented"], "internalDocs": ["Bonus Regulation (Положение о премировании)", "Pay Regulation", "Compensation clause of the employment contract"]}, "ru": {"background": "В 2023 году Конституционный суд признал неконституционной практику произвольного лишения премий работодателем (Постановление № 32-П). В связи с этим внесены изменения в ст. 135 ТК РФ (Федеральный закон № 144-ФЗ от 07.06.2025).", "whatChanged": "① Виды, размеры, условия выплаты и основания невыплаты премий должны быть чётко закреплены во внутреннем локальном акте (ЛНА). ② Премию можно уменьшить только за месяц, в котором произошло дисциплинарное нарушение (полностью лишить квартальной или годовой премии больше нельзя). ③ Даже при снижении премия не может быть уменьшена более чем на 20% от общей суммы зарплаты за месяц.", "penalty": "Снижение премии без документального основания приводит к проигрышу в трудовом споре, приказу о доплате и штрафу от ГИТ. Нарушения, связанные с оплатой труда, — один из главных объектов законопроекта об увеличении штрафов (LAB-007).", "process": "Запросить у юриста по трудовому праву проверку действующего положения о премировании → подготовить исправленную редакцию → ознакомить сотрудников под подпись → впредь любое снижение премии проводить только на основании письменного приказа о дисциплинарном взыскании.", "hrChecklist": ["Проверить, что положение об оплате труда/премировании содержит конкретные критерии выплаты (KPI, формула расчёта, сроки, основания невыплаты)", "Убрать или заменить расплывчатые формулировки вроде «может выплачиваться по усмотрению компании»", "Убедиться, что связка «дисциплинарное взыскание — премия» соответствует правилу «тот же месяц, лимит 20%»", "Если есть система торговых бонусов, отдельно проверить документирование базы расчёта"], "internalDocs": ["Положение о премировании", "Положение об оплате труда", "Раздел трудового договора об оплате труда"]}}}, {"id": "LAB-003", "category": "급여·보상", "titleKo": "멘토링(наставничество) 유급 의무화", "titleRu": "Наставничество — ст. 351.8 ТК РФ", "status": "시행중", "impact": "Medium", "effectiveDate": "2025-03-01", "background": "신입 교육 담당(멘토) 업무가 무보수 관행이던 것을 법으로 유급화. 노동법전에 351.8조 신설.", "whatChanged": "직원에게 멘토 역할을 맡기려면 ① 본인 서면 동의, ② 근로계약서 또는 추가합의서(допсоглашение/supplementary agreement)에 멘토링 조건 명시, ③ 별도 수당 지급이 모두 필요. 강제 지정 불가.", "penalty": "무보수 멘토링 운영 시 임금 미지급으로 간주될 수 있음 — 소급 지급 + 벌금 리스크.", "hrChecklist": ["신입 온보딩·매장 교육 담당자를 비공식적으로 운영하고 있는지 현황 파악", "멘토 지정 시 допсоглашение 템플릿 준비 (업무 범위·기간·수당 명시)", "멘토 수당 기준을 보수규정에 반영"], "internalDocs": ["근로계약서/допсоглашение 템플릿", "보수규정"], "process": "현재 멘토 역할 수행자 리스트업 → 수당 기준 책정(본사 예산 협의) → 개별 합의서 체결", "glossary": [{"term": "допсоглашение", "ko": "근로계약 추가합의서 — 계약 조건 변경 시 필수", "en": "supplementary agreement"}], "sources": ["https://www.consultant.ru/legalnews/26931/", "https://taxcom.ru/baza-znaniy/kadrovaya-otchetnost/stati/kak-s-1-marta-2025-goda-oformlyat-i-oplachivat-nastavnichestvo/"], "titleEn": "Mentoring — new Art. 351.8 of the Labor Code", "i18n": {"en": {"background": "Compensating employees who mentor new hires used to be an informal, often unpaid practice. It is now formalized and made mandatory-paid under new Article 351.8 of the Labor Code.", "whatChanged": "Assigning an employee as a mentor now requires all three: ① their written consent, ② mentoring terms specified in the employment contract or a supplementary agreement, and ③ a separate mentoring allowance. Mentors cannot be assigned by force.", "penalty": "Running an unpaid mentoring arrangement can be treated as unpaid wages — carrying the risk of retroactive payment plus fines.", "process": "List everyone currently performing onboarding/in-store training duties → set the allowance level (coordinate budget with headquarters) → sign individual supplementary agreements.", "hrChecklist": ["Check whether new-hire onboarding or in-store training is being run informally by unofficial mentors", "Prepare a supplementary agreement template for mentor assignments (scope, duration, allowance)", "Reflect the mentoring allowance standard in the Pay Regulation"], "internalDocs": ["Employment contract / supplementary agreement template", "Pay Regulation"]}, "ru": {"background": "Наставничество новых сотрудников ранее было неформальной и часто неоплачиваемой практикой. Теперь оно закреплено и сделано обязательно оплачиваемым согласно новой ст. 351.8 ТК РФ.", "whatChanged": "Назначение сотрудника наставником требует одновременно: ① его письменного согласия, ② указания условий наставничества в трудовом договоре или допсоглашении, ③ выплаты отдельной надбавки. Принудительное назначение наставником недопустимо.", "penalty": "Неоплачиваемое наставничество может быть квалифицировано как невыплата заработной платы — с риском доплаты задним числом и штрафов.", "process": "Составить список сотрудников, фактически выполняющих функции наставника при онбординге/обучении в магазине → определить размер надбавки (согласовать бюджет с головным офисом) → заключить индивидуальные допсоглашения.", "hrChecklist": ["Проверить, ведётся ли онбординг новых сотрудников/обучение в магазине неформальными наставниками", "Подготовить шаблон допсоглашения для назначения наставника (объём работы, срок, надбавка)", "Отразить норматив надбавки за наставничество в Положении об оплате труда"], "internalDocs": ["Шаблон трудового договора/допсоглашения", "Положение об оплате труда"]}}}, {"id": "LAB-004", "category": "채용·해고", "titleKo": "시험기간(испытательный срок) 금지 대상 확대 — 3세 미만 자녀 둔 여성", "titleRu": "Запрет испытательного срока — 91-ФЗ от 09.04.2026", "status": "시행예정", "impact": "Medium", "effectiveDate": "2026-09-01", "background": "출산·육아 지원 정책의 일환으로 '보호 대상 근로자' 범위를 계속 확대하는 흐름. 노동법전 70조 개정(2026-04-09 연방법 91-ФЗ).", "whatChanged": "시험기간을 설정할 수 없는 대상이 '1.5세 미만 자녀를 둔 여성' → '3세 미만 자녀를 둔 여성'으로 확대. 위반 시 해당 조항 자체가 무효.", "penalty": "시험기간 불합격을 이유로 해고 시 부당해고 — 복직 + 미지급 임금 배상. 계약서에 조항만 넣어도 위반.", "hrChecklist": ["채용 프로세스에서 지원자의 자녀 연령을 '시험기간 설정 가능 여부' 판단에만 사용하도록 절차 정리 (채용 차별로 이어지지 않게 주의)", "근로계약서 템플릿에 시험기간 예외 대상 체크 항목 추가", "9/1 이전 입사자라도 시험기간 진행 중이면 적용 여부 노무 자문 확인"], "internalDocs": ["근로계약서 템플릿", "채용 절차 가이드"], "process": "채용 담당자 교육 → 계약서 템플릿 개정 → 9월 이후 신규 채용 건부터 적용", "glossary": [{"term": "испытательный срок", "ko": "시험기간(수습) — 통상 최대 3개월", "en": "probation period"}], "sources": ["https://s-pro.group/tpost/s5gajamd61-izmeneniya-v-trudovom-kodekse-rf-v-2026"], "titleEn": "Ban on probation period — Law 91-FZ of Apr 9, 2026", "i18n": {"en": {"background": "Part of an ongoing trend of widening the category of \"protected employees\" as part of family and childcare support policy. Article 70 of the Labor Code was amended (Federal Law No. 91-FZ of Apr 9, 2026).", "whatChanged": "The group for whom a probation period cannot be set has been expanded from \"women with a child under 1.5 years old\" to \"women with a child under 3 years old.\" A violation renders the probation clause itself void.", "penalty": "Dismissing someone for \"failing probation\" when the clause was invalid counts as unlawful dismissal — reinstatement plus back pay. Simply including the clause in the contract is itself a violation.", "process": "Train recruiters → revise the employment contract template → apply to all new hires from September onward.", "hrChecklist": ["In the hiring process, use a candidate's child's age only to determine probation eligibility — never let it factor into the hiring decision itself (to avoid discrimination claims)", "Add a probation-exemption check field to the employment contract template", "For anyone hired before Sept 1 who is still in a probation period, confirm with a labor advisor whether the new rule applies"], "internalDocs": ["Employment contract template", "Hiring process guide"]}, "ru": {"background": "Продолжение тенденции расширения категории «защищённых работников» в рамках политики поддержки семей с детьми. Внесены изменения в ст. 70 ТК РФ (Федеральный закон № 91-ФЗ от 09.04.2026).", "whatChanged": "Категория, для которой запрещено устанавливать испытательный срок, расширена с «женщин с ребёнком до 1,5 лет» до «женщин с ребёнком до 3 лет». При нарушении условие об испытательном сроке признаётся недействительным.", "penalty": "Увольнение по причине «непрохождения испытания» при недействительном условии квалифицируется как незаконное увольнение — восстановление на работе и выплата за вынужденный прогул. Само включение такого условия в договор уже является нарушением.", "process": "Обучить сотрудников по подбору персонала → пересмотреть шаблон трудового договора → применять ко всем новым сотрудникам начиная с сентября.", "hrChecklist": ["В процессе найма использовать возраст ребёнка кандидата только для определения возможности установления испытательного срока — не допускать влияния на решение о найме (риск дискриминации)", "Добавить в шаблон трудового договора поле для проверки исключения по испытательному сроку", "Для сотрудников, принятых до 1 сентября и всё ещё проходящих испытание, уточнить у юриста применимость новой нормы"], "internalDocs": ["Шаблон трудового договора", "Руководство по процедуре найма"]}}}, {"id": "LAB-005", "category": "채용·해고", "titleKo": "감원 시 СВО(특별군사작전) 복귀자 우선 잔류권", "titleRu": "Преимущественное право при сокращении — 108-ФЗ от 25.04.2026", "status": "시행예정", "impact": "High", "effectiveDate": "2026-09-01", "background": "군 복무 후 복직한 직원 보호 강화 정책. 노동법전 179조 개정(2026-04-25 연방법 108-ФЗ).", "whatChanged": "인원 감축(сокращение/redundancy) 시 '동원·계약·자원 참전 후 복직한 직원'이 동일 생산성 조건에서 우선 잔류권을 가짐. 기존 우선권 대상(부양가족 다수 등)에 새 카테고리 추가.", "penalty": "우선권 무시하고 감원 시 법원 복직 판결 + 강제휴직 기간 임금 전액 배상. 러시아 법원은 근로자 승소율이 높음.", "hrChecklist": ["인사파일에서 СВО 참전 후 복직자(계약 정지 이력자) 명단 사전 파악", "향후 구조조정 계획 수립 시 우선권 매트릭스에 해당 카테고리 반영", "감원 절차 체크리스트(2개월 전 통지, 대체직 제안 등) 문서화"], "internalDocs": ["감원 절차 내부 가이드", "인사파일 관리 대장"], "process": "감원 검토 단계에서 반드시 노무 자문사와 대상자 심사 → 우선권 심사 기록을 서면으로 남김 → 본사 보고 시 법적 리스크 명시", "glossary": [{"term": "сокращение штата", "ko": "인원 감축 — 러시아에서 가장 소송 리스크가 큰 해고 유형. 2개월 전 서면 통지 + 퇴직수당 최대 3개월분", "en": "staff redundancy"}], "sources": ["https://s-pro.group/tpost/s5gajamd61-izmeneniya-v-trudovom-kodekse-rf-v-2026"], "titleEn": "Priority retention in redundancy — Law 108-FZ of Apr 25, 2026", "i18n": {"en": {"background": "Policy strengthening protection for employees who return to work after military service. Article 179 of the Labor Code was amended (Federal Law No. 108-FZ of Apr 25, 2026).", "whatChanged": "During staff redundancy, employees who resumed work after having their contract suspended for mobilization, contract service, or volunteering in the special military operation (SVO) now get priority retention when productivity is equal. This adds a new category to the existing priority list (e.g., employees with multiple dependents).", "penalty": "Ignoring this priority right when downsizing risks a court-ordered reinstatement plus full back pay for the forced-leave period. Russian courts rule in the employee's favor at a high rate.", "process": "Always screen candidates for redundancy together with a labor law advisor at the review stage → keep a written record of the priority-right assessment → explicitly flag the legal risk when reporting to headquarters.", "hrChecklist": ["Proactively identify, from HR files, employees who returned to work after SVO participation (contract-suspension history)", "When planning any future restructuring, reflect this new category in the priority-retention matrix", "Document the redundancy procedure checklist (2-month advance notice, alternative position offers, etc.)"], "internalDocs": ["Internal redundancy procedure guide", "HR file register"]}, "ru": {"background": "Политика усиления защиты работников, возобновивших работу после военной службы. Внесены изменения в ст. 179 ТК РФ (Федеральный закон № 108-ФЗ от 25.04.2026).", "whatChanged": "При сокращении штата работники, возобновившие работу после приостановления трудового договора в связи с мобилизацией, контрактной службой или добровольческим участием в СВО, получают преимущественное право на оставление на работе при равной производительности труда. Это новая категория в дополнение к уже существующим (например, лица с несколькими иждивенцами).", "penalty": "Игнорирование преимущественного права при сокращении влечёт риск восстановления на работе по решению суда и выплаты полного среднего заработка за время вынужденного прогула. Российские суды часто встают на сторону работника.", "process": "На этапе рассмотрения сокращения обязательно проводить проверку кандидатов совместно с юристом по трудовому праву → фиксировать оценку преимущественного права письменно → при докладе головному офису явно указывать юридический риск.", "hrChecklist": ["Заранее выявить в личных делах сотрудников, вернувшихся на работу после участия в СВО (с историей приостановки договора)", "При планировании будущей реструктуризации отразить новую категорию в матрице преимущественного права", "Задокументировать чек-лист процедуры сокращения (уведомление за 2 месяца, предложение других вакансий и т.д.)"], "internalDocs": ["Внутреннее руководство по процедуре сокращения", "Реестр личных дел сотрудников"]}}}, {"id": "LAB-006", "category": "문서·시스템", "titleKo": "인사 전자문서(КЭДО) 확대 — 국산 메신저 MAX 연동", "titleRu": "Расширение КЭДО, мессенджер MAX", "status": "계류중", "impact": "Medium", "effectiveDate": "2026-09-01(예정)", "background": "노동부(Минтруд/Ministry of Labor)가 인사 문서의 전면 디지털화를 추진. 국가 플랫폼 '일자리 러시아(Работа в России/Rabota v Rossii)' 및 국산 메신저 MAX와 연동하는 개정안 발의.", "whatChanged": "① 원격근무자와 비적격 전자서명(НЭП/NEP)으로 근로계약 체결 허용 확대, ② MAX 메신저를 통한 인사문서 교환 시 단순 전자서명을 자필 서명과 동등 인정(예정), ③ КЭДО/KEDO 도입 절차·직원 동의 규정을 ЛНА/LNA에 상세 규정해야 함.", "penalty": "직접 벌금보다는, 절차(규정·동의) 없이 종이 문서를 없애면 문서 부재로 간주되는 리스크.", "hrChecklist": ["КЭДО 도입 여부 방침 결정 (도입 시 종이·서명 업무 대폭 감소, 특히 원격근무자)", "도입 시: КЭДО 규정(Положение о КЭДО/KEDO Regulation) 제정 + 직원 개별 서면 동의 수집 + 전자서명 제공업체 선정", "본사 보안 정책과 MAX·국가 플랫폼 연동의 충돌 여부 사전 검토 (데이터가 국가 시스템을 경유)"], "internalDocs": ["КЭДО 규정(신설)", "직원 동의서 양식", "취업규칙(ПВТР/PVTR) 문서 조항"], "process": "법안 확정 모니터링 → IT·보안팀과 시스템 검토 → 본사 승인 → 규정 제정·동의 수집 → 단계적 전환", "glossary": [{"term": "НЭП", "ko": "비적격 전자서명 — 공인인증서보다 낮은 등급의 전자서명", "en": "non-qualified e-signature"}, {"term": "MAX", "ko": "러시아 국산 메신저(VK 개발) — 정부가 공공서비스 채널로 육성 중", "en": "MAX messenger (VK)"}], "sources": ["https://kontur.ru/articles/4819", "https://s-pro.group/tpost/s5gajamd61-izmeneniya-v-trudovom-kodekse-rf-v-2026"], "titleEn": "Expansion of HR e-documents (KEDO), MAX messenger", "i18n": {"en": {"background": "The Ministry of Labor is pushing to fully digitize HR documentation, proposing amendments that link it to the state platform \"Rabota v Rossii\" and the domestic messenger app MAX.", "whatChanged": "① Broader ability to sign employment contracts with remote workers using a non-qualified electronic signature (NEP). ② Document exchange via the MAX messenger is set to recognize a simple electronic signature as equivalent to a handwritten one. ③ The procedure for introducing KEDO and obtaining employee consent must be spelled out in detail in an internal regulation (LNA).", "penalty": "Not so much a direct fine — the risk is that eliminating paper documents without proper procedures (regulation + consent) in place can be treated as a missing-documentation violation.", "process": "Monitor the bill until finalized → review the system with IT/security → get headquarters approval → establish the regulation and collect consents → roll out in phases.", "hrChecklist": ["Decide the company's policy on adopting KEDO (adoption sharply cuts paper/signature workload, especially for remote workers)", "If adopting: establish a KEDO Regulation, collect individual written consent from employees, and select an e-signature provider", "Pre-review whether integrating with MAX and the state platform conflicts with headquarters security policy (since data passes through a state system)"], "internalDocs": ["KEDO Regulation (new)", "Employee consent form", "Internal labor rules (PVTR) document clause"]}, "ru": {"background": "Минтруд продвигает полную цифровизацию кадрового документооборота, предлагая поправки, увязывающие его с государственной платформой «Работа в России» и отечественным мессенджером MAX.", "whatChanged": "① Расширена возможность заключать трудовые договоры с дистанционными работниками с использованием неквалифицированной электронной подписи (НЭП). ② При обмене кадровыми документами через мессенджер MAX простая электронная подпись приравнивается к собственноручной (планируется). ③ Порядок внедрения КЭДО и получения согласия работника должен быть подробно закреплён в ЛНА.", "penalty": "Прямого штрафа немного — риск в том, что отказ от бумажных документов без надлежащих процедур (положение + согласие) может быть расценён как отсутствие необходимой документации.", "process": "Отслеживать окончательное принятие законопроекта → рассмотреть систему совместно с ИТ/безопасностью → получить одобрение головного офиса → утвердить положение и собрать согласия → внедрять поэтапно.", "hrChecklist": ["Определить политику компании по внедрению КЭДО (внедрение резко сокращает бумажный документооборот и подписи, особенно для дистанционных работников)", "При внедрении: утвердить Положение о КЭДО, собрать индивидуальные письменные согласия сотрудников, выбрать провайдера электронной подписи", "Заранее проверить, не конфликтует ли интеграция с MAX и госплатформой с политикой безопасности головного офиса (данные проходят через государственную систему)"], "internalDocs": ["Положение о КЭДО (новое)", "Форма согласия сотрудника", "Пункт ПВТР о документообороте"]}}, "effectiveDateI18n": {"en": "2026-09-01 (planned)", "ru": "2026-09-01 (планируется)"}}, {"id": "LAB-007", "category": "급여·보상", "titleKo": "노동법 위반 벌금 상향 법안 (최대 2배 수준)", "titleRu": "Законопроект № 1188246-8 — повышение штрафов", "status": "계류중", "impact": "Medium", "effectiveDate": "2026년 내 채택 전망", "background": "임금 체불과 산업안전 위반에 대한 제재 강화 목적. 국가두마 심의 중이며 2026년 내 통과 전망.", "whatChanged": "반복 위반 기준 벌금 상향안: 임원·개인사업자 3~4만₽ → 4~5만₽, 법인 10~20만₽ → 15~25만₽. 주요 타깃은 임금 지연 지급과 산업안전(보호구 미지급, 건강검진 미실시).", "penalty": "해당 법안 자체가 벌금 규정.", "hrChecklist": ["급여 지급일 준수 현황 점검 (러시아는 월 2회 지급 의무 — 15일 간격 이내)", "산업안전 서류(안전교육 일지, 근로환경평가 СОУТ/SOUT) 유효기간 확인", "사무직 중심이라도 의무 건강검진 대상 직군(운전 업무 등) 여부 확인"], "internalDocs": ["급여 지급 일정 규정", "산업안전 관련 대장"], "process": "법안 통과 시점 모니터링 → 통과 전 내부 감사(급여·안전 서류) 선제 실시", "glossary": [{"term": "СОУТ", "ko": "근로환경 특별평가 — 5년마다 전 사업장 의무", "en": "special assessment of working conditions"}], "sources": ["https://s-pro.group/tpost/s5gajamd61-izmeneniya-v-trudovom-kodekse-rf-v-2026"], "titleEn": "Draft law No. 1188246-8 — increase of fines", "i18n": {"en": {"background": "Aimed at tightening sanctions for wage arrears and workplace-safety violations. Under review in the State Duma, expected to pass within 2026.", "whatChanged": "Proposed fine increase for repeat violations: executives/sole proprietors from RUB 30-40K to RUB 40-50K; companies from RUB 100-200K to RUB 150-250K. Main targets are delayed wage payment and workplace safety (missing PPE, skipped medical exams).", "penalty": "The bill itself is the fine schedule.", "process": "Monitor when the bill passes → proactively run an internal audit (payroll and safety documentation) before it takes effect.", "hrChecklist": ["Check compliance with pay-date rules (Russia requires payment twice a month, no more than 15 days apart)", "Confirm workplace-safety documents (safety briefing logs, SOUT working-condition assessment) are up to date", "Even for office-heavy workforces, check whether any role (e.g., drivers) is subject to mandatory medical exams"], "internalDocs": ["Payroll payment schedule regulation", "Workplace safety register"]}, "ru": {"background": "Цель — усилить санкции за задержку зарплаты и нарушения охраны труда. Законопроект рассматривается Госдумой, ожидается принятие в течение 2026 года.", "whatChanged": "Предлагается повышение штрафов за повторные нарушения: для должностных лиц/ИП — с 30-40 тыс. ₽ до 40-50 тыс. ₽; для юрлиц — со 100-200 тыс. ₽ до 150-250 тыс. ₽. Основные цели — задержка зарплаты и нарушения охраны труда (отсутствие СИЗ, непроведение медосмотров).", "penalty": "Сам законопроект и есть перечень штрафов.", "process": "Отслеживать момент принятия законопроекта → заранее провести внутренний аудит (зарплатные ведомости и документация по охране труда) до вступления в силу.", "hrChecklist": ["Проверить соблюдение сроков выплаты зарплаты (в РФ обязательна выплата 2 раза в месяц с интервалом не более 15 дней)", "Убедиться в актуальности документов по охране труда (журналы инструктажей, оценка условий труда СОУТ)", "Даже при преимущественно офисном штате проверить, есть ли должности (например, водители), подлежащие обязательным медосмотрам"], "internalDocs": ["Положение о графике выплаты зарплаты", "Реестр документов по охране труда"]}}, "effectiveDateI18n": {"en": "Expected to pass within 2026", "ru": "Ожидается принятие в течение 2026 года"}}, {"id": "LAB-008", "category": "채용·해고", "titleKo": "노동법전 개정안(초과근무 240시간·해고사유·휴가소환) — 연방법 제144-ФЗ호로 공포", "titleRu": "Федеральный закон № 144-ФЗ от 25.05.2026 — поправки в ТК РФ", "status": "시행예정", "impact": "High", "effectiveDate": "2026-09-01", "background": "인력난 대응을 위한 노동시장 유연화 패키지 법안(구 법안번호 1103297-8)이 2독회·3독회를 통과해 2026-05-25 대통령 서명으로 연방법 제144-ФЗ호로 공포됨. 2026-09-01 시행 예정이며 세부 내용이 확정됨.", "whatChanged": "① 초과근무(сверхурочная работа/overtime) 연간 한도를 120시간→240시간으로 확대 가능 — 단, 반드시 단체협약(коллективный договор) 또는 업종별 협약에 근거 규정이 있어야 하며 회사 일방 결정으로는 불가. 유해작업 3.3·3.4등급 근로자는 여전히 120시간 상한 유지. 3.1·3.2등급·연금수급자·준연금수급자는 서면 동의+건강상 결격사유 없음 확인 시에만 120시간 초과 가능. 보상: 최초 2시간 1.5배 이상, 이후(120시간 이내) 2배 이상, 120시간 초과분은 전부 2배 이상(또는 대체휴무). 120시간 초과 근무자는 연 1회 유급 건강검진일 부여. ② 중소기업 기간제 계약(срочный трудовой договор) 체결 가능 직원 수 상한 확대: 일반 업종 35명→70명, 소매·서비스업 20명→70명. ③ 휴가 중 소환(отзыв из отпуска/vacation recall): 유해작업 근로자는 재해 예방 등 예외 상황 외 소환 금지. 그 외 근로자 소환 시 2배 이상 보상 + 본인이 원하는 시기로 잔여휴가 재조정 의무. ④ 해고 사유(노동법 제81조) 확대: 절도·횡령·직장 내 고의적 재산 손괴로 형사기소가 비面책적 사유로 종결되어도 해고 가능.", "penalty": "초과근무 한도·보상 규정 위반 시 근로감독청(ГИТ) 실사에서 КоАП/Admin. Offenses Code 5.27조 적용 — 법인 벌금 건당 최대 5만₽(반복 시 가중, 최대 10만₽ 이상). 위법한 휴가 소환·해고 시 근로자 소송으로 복직·임금 소급·정신적 손해배상 청구 가능.", "hrChecklist": ["회사가 초과근무 한도를 240시간까지 확대할지 결정 — 확대하려면 단체협약/업종별 협약에 근거 조항 신설 필요(일방 규정 불가)", "유해작업 등급(3.1~3.4)별 대상자 명단 정리 후 서면 동의서·건강상 결격사유 확인서 양식 준비", "급여 시스템에 120시간 초과분 2배 보상 및 연 1회 유급 건강검진일 반영", "휴가 소환 절차서(사유·보상 2배·재조정 방법)를 신설/개정하고 유해작업자는 소환 대상에서 제외 확인", "절도·횡령 관련 해고 처리 시 개정된 제81조 근거로 노무 자문과 함께 절차 재점검", "중소기업 해당 여부 확인 후 기간제 계약 활용 확대 가능성(70명 상한) 검토"], "internalDocs": ["취업규칙(ПВТР, 근로시간·휴가 조항)", "단체협약/업종별 협약(초과근무 한도 근거 조항)", "급여 계산 정책(초과근무·건강검진일)", "휴가 소환 절차서 및 동의서 양식", "해고 절차 가이드(제81조)", "기간제 계약 템플릿"], "process": "노무 자문에게 개정 내용 최종 확인 → 초과근무 한도 확대 여부 노사 협의(단체협약 개정) → ПВТР·급여 시스템·휴가 소환 양식 개정(2026-09-01 전 완료) → 전 직원 공지 → 본사 보고", "glossary": [{"term": "срочный трудовой договор", "ko": "기간제 근로계약 — 러시아는 사유 제한 열거주의라 체결 요건이 엄격", "en": "fixed-term employment contract"}], "sources": ["https://www.garant.ru/news/2089672/", "https://www.klerk.ru/buh/articles/692656/", "https://www.audit-it.ru/news/personnel/1133950.html"], "titleEn": "Federal Law No. 144-FZ of May 25, 2026 — Labor Code amendments", "i18n": {"en": {"background": "The labor-market flexibility package (formerly draft bill No. 1103297-8) passed its 2nd and 3rd Duma readings and was signed into law by the President on 2026-05-25 as Federal Law No. 144-FZ. It takes effect 2026-09-01 with all details now finalized.", "whatChanged": "① The annual overtime limit can be raised from 120 to 240 hours — but only if a collective agreement or sectoral agreement expressly provides for it; a company cannot raise the limit unilaterally. Workers in hazardous-condition subcategories 3.3-3.4 remain capped at 120 hours. Subcategories 3.1-3.2, pensioners, and pre-retirees may exceed 120 hours only with written consent and confirmation of no medical contraindications. Pay: the first 2 hours at 1.5x minimum, subsequent hours up to 120 at 2x minimum, and all hours beyond 120 at 2x minimum (or compensatory time off). Workers who exceed 120 hours get one paid medical check-up day per year. ② The employee-count ceiling for using fixed-term contracts at small/medium businesses rises from 35 to 70 generally, and from 20 to 70 for retail/services. ③ Vacation recall: hazardous-condition workers cannot be recalled from vacation except to prevent accidents/disasters; other recalled employees must be paid at least 2x and get their remaining leave rescheduled at a time of their choosing. ④ Dismissal grounds (Labor Code Art. 81) expanded: a court's non-exculpatory termination of a criminal case no longer blocks dismissal for workplace theft, embezzlement, or intentional property damage.", "penalty": "Violating the overtime limit/compensation rules exposes the company to a labor-inspectorate (GIT) fine under Administrative Offenses Code Art. 5.27 — up to RUB 50,000 per violation (higher for repeat violations). Unlawful vacation recall or dismissal can lead to employee lawsuits for reinstatement, back pay, and moral damages.", "process": "Confirm the finalized rules with a labor advisor → negotiate with staff/union on whether to raise the overtime limit (requires a collective-agreement amendment) → update internal labor rules, payroll system, and vacation-recall forms before 2026-09-01 → notify all staff → report to headquarters.", "hrChecklist": ["Decide whether the company will raise the overtime limit to 240 hours — doing so requires a new clause in a collective or sectoral agreement (cannot be set unilaterally)", "List employees by hazardous-work subcategory (3.1-3.4) and prepare written-consent and no-contraindication confirmation forms", "Update payroll to pay 2x for hours beyond 120 and to grant one paid medical check-up day per year", "Create or revise a vacation-recall procedure (grounds, 2x pay, rescheduling method) and confirm hazardous-condition workers are excluded from recall", "Re-review theft/embezzlement dismissal procedures with a labor advisor under the amended Art. 81", "Check whether the company qualifies as a small/medium business and reassess fixed-term contract usage under the new 70-employee ceiling"], "internalDocs": ["Internal labor rules (working-hours and vacation clauses)", "Collective agreement / sectoral agreement (overtime-limit clause)", "Payroll calculation policy (overtime, medical check-up day)", "Vacation-recall procedure and consent forms", "Dismissal procedure guide (Art. 81)", "Fixed-term contract template"]}, "ru": {"background": "Пакет мер по повышению гибкости рынка труда (бывший законопроект № 1103297-8) прошёл второе и третье чтения в Госдуме и 25.05.2026 подписан Президентом как Федеральный закон № 144-ФЗ. Вступает в силу 01.09.2026, все детали уже окончательно определены.", "whatChanged": "① Годовой лимит сверхурочной работы можно увеличить со 120 до 240 часов — но только если это прямо предусмотрено коллективным договором или отраслевым соглашением; работодатель не может увеличить лимит в одностороннем порядке. Для вредных подклассов 3.3-3.4 сохраняется лимит 120 часов. Для подклассов 3.1-3.2, пенсионеров и предпенсионеров превышение 120 часов возможно только с письменного согласия и при отсутствии медицинских противопоказаний. Оплата: первые 2 часа не менее чем в 1,5-кратном размере, далее до 120 часов — не менее чем в 2-кратном, всё свыше 120 часов — не менее чем в 2-кратном размере (или отгул). Работникам, превысившим 120 часов, положен один оплачиваемый день для медосмотра в год. ② Порог численности работников для заключения срочных трудовых договоров на малых/средних предприятиях повышен: с 35 до 70 — в целом, с 20 до 70 — в рознице и сфере услуг. ③ Отзыв из отпуска: работников на вредных условиях труда нельзя отзывать из отпуска, кроме случаев предотвращения катастроф/аварий; остальным отозванным положена оплата не менее чем в 2-кратном размере и перенос оставшейся части отпуска на удобное для них время. ④ Основания увольнения (ст. 81 ТК РФ) расширены: прекращение уголовного преследования по нереабилитирующим основаниям больше не препятствует увольнению за хищение, растрату или умышленное повреждение имущества на рабочем месте.", "penalty": "Нарушение правил лимита/оплаты сверхурочной работы влечёт штраф по ст. 5.27 КоАП РФ при проверке ГИТ — до 50 000 ₽ за каждое нарушение (при повторных — больше). Незаконный отзыв из отпуска или увольнение могут привести к искам работников о восстановлении, взыскании зарплаты и компенсации морального вреда.", "process": "Уточнить у юриста по трудовому праву финальные формулировки → провести переговоры с работниками/профсоюзом о повышении лимита сверхурочных (требуется изменение коллективного договора) → до 01.09.2026 обновить ПВТР, систему расчёта зарплаты и формы отзыва из отпуска → уведомить всех сотрудников → доложить головному офису.", "hrChecklist": ["Решить, будет ли компания повышать лимит сверхурочных до 240 часов — для этого нужен новый пункт в коллективном или отраслевом соглашении (в одностороннем порядке нельзя)", "Составить список сотрудников по подклассам вредности (3.1-3.4) и подготовить формы письменного согласия и подтверждения отсутствия противопоказаний", "Обновить расчёт зарплаты для оплаты 2x за часы свыше 120 и предоставления оплачиваемого дня медосмотра", "Разработать/пересмотреть процедуру отзыва из отпуска (основания, оплата 2x, порядок переноса) и убедиться, что вредники исключены из отзыва", "Пересмотреть с юристом процедуру увольнения за хищение/растрату с учётом обновлённой ст. 81", "Проверить, относится ли компания к малому/среднему бизнесу, и пересмотреть использование срочных договоров с учётом нового порога в 70 человек"], "internalDocs": ["ПВТР (разделы о рабочем времени и отпусках)", "Коллективный договор / отраслевое соглашение (пункт о лимите сверхурочных)", "Политика расчёта зарплаты (сверхурочные, день медосмотра)", "Процедура отзыва из отпуска и формы согласия", "Инструкция по процедуре увольнения (ст. 81)", "Шаблон срочного трудового договора"]}}}, {"id": "LAB-009", "category": "급여·보상", "titleKo": "임금 인덱세이션(물가연동 인상) 의무화 법안", "titleRu": "Обязательная индексация зарплат — поправка в ст. 134 ТК", "status": "논의중", "impact": "High", "effectiveDate": "미정 (2026년 발의)", "background": "현행법도 민간기업에 인덱세이션 의무를 부과하지만 주기·비율이 불명확해 사실상 형해화. 초당파 의원 그룹(노동위원장 Я. Нилов/Ya. Nilov 주도)이 '연 1회 이상, 전년도 인플레이션 이상' 의무화 개정안 추진.", "whatChanged": "통과 시: 최소 연 1회, 전년 물가상승률 이상의 급여 인상이 법적 의무가 됨. 일회성 보너스나 지원금으로 대체 불가 명시.", "penalty": "통과 시 미이행은 임금 관련 위반으로 벌금 + 소급 청구 리스크. 현재도 인덱세이션 규정 부재는 ГИТ/GIT 지적 사항.", "hrChecklist": ["현재 ЛНА/LNA에 인덱세이션 조항이 있는지 확인 — 없으면 지금도 리스크이므로 우선 신설 권고", "본사 인건비 계획에 '러시아 인플레율 연동 인상' 시나리오 반영 (러시아 인플레이션 감안 시 재무 영향 큼)", "법안 진행 상황 분기별 모니터링"], "internalDocs": ["보수규정(인덱세이션 조항)", "단체협약(있는 경우)"], "process": "노무 자문사에 현행 인덱세이션 조항 적정성 검토 의뢰 → 본사에 인건비 시나리오 보고 → 법안 통과 시 즉시 규정 개정", "glossary": [{"term": "индексация зарплат", "ko": "물가연동 임금 인상 — 러시아 노동법 특유의 개념", "en": "wage indexation"}], "sources": ["https://www.kommersant.ru/doc/8340077", "https://www.glavbukh.ru/art/392502-indeksirovat-zarplaty-new"], "titleEn": "Mandatory wage indexation — amendment to Art. 134 of the Labor Code", "i18n": {"en": {"background": "Current law already requires private companies to index wages, but with no clear frequency or rate it is effectively toothless. A cross-party group of Duma deputies (led by Labor Committee chair Ya. Nilov) is pushing an amendment mandating indexation \"at least once a year, at or above the prior year's inflation rate.\"", "whatChanged": "If passed: a wage increase of at least once a year, at or above the prior year's inflation rate, becomes a legal obligation. It explicitly cannot be substituted with a one-time bonus or allowance.", "penalty": "If passed, non-compliance becomes a wage-related violation carrying fines plus retroactive claims. Even now, the absence of an indexation clause is something GIT flags.", "process": "Have a labor advisor review the adequacy of the current indexation clause → report payroll-cost scenarios to headquarters → amend the regulation immediately if the bill passes.", "hrChecklist": ["Check whether the current internal regulation (LNA) has an indexation clause at all — if not, this is already a risk today and should be added as a priority", "Reflect a \"raise linked to Russian inflation\" scenario in the headquarters payroll-cost plan (the financial impact can be significant given Russian inflation)", "Monitor the bill's progress quarterly"], "internalDocs": ["Pay Regulation (indexation clause)", "Collective agreement (if any)"]}, "ru": {"background": "Действующий закон уже обязывает частные компании индексировать зарплату, но из-за отсутствия чёткой периодичности и размера норма фактически не работает. Межфракционная группа депутатов Госдумы (во главе с председателем Комитета по труду Я. Ниловым) продвигает поправку, устанавливающую индексацию «не реже одного раза в год не ниже уровня инфляции за предыдущий год».", "whatChanged": "В случае принятия: повышение зарплаты не реже одного раза в год не ниже уровня инфляции предыдущего года станет законодательно обязательным. Прямо указано, что замена разовой премией или материальной помощью недопустима.", "penalty": "В случае принятия невыполнение станет нарушением, связанным с оплатой труда, с риском штрафов и требований о доплате задним числом. Уже сейчас отсутствие пункта об индексации — предмет замечаний ГИТ.", "process": "Запросить у юриста по трудовому праву оценку адекватности действующего пункта об индексации → доложить головному офису сценарии влияния на ФОТ → незамедлительно скорректировать положение в случае принятия закона.", "hrChecklist": ["Проверить, есть ли вообще пункт об индексации в действующем ЛНА — если нет, это уже риск сейчас и требует приоритетного добавления", "Отразить в плане ФОТ головного офиса сценарий «повышение с учётом российской инфляции» (финансовое влияние может быть значительным)", "Ежеквартально отслеживать ход рассмотрения законопроекта"], "internalDocs": ["Положение об оплате труда (пункт об индексации)", "Коллективный договор (при наличии)"]}}, "effectiveDateI18n": {"en": "TBD (bill expected in 2026)", "ru": "Не определено (законопроект ожидается в 2026 году)"}}, {"id": "LAB-010", "category": "외국인·주재원", "titleKo": "외국인 직원 해고 사유 확대 — 지역별 고용 제한 반영", "titleRu": "419-ФЗ от 17.11.2025 — поправка в ст. 327.6 ТК", "status": "시행중", "impact": "Medium", "effectiveDate": "2026-03-02", "background": "각 지역(субъект РФ/region of RF)이 특정 업종의 외국인 고용을 금지·제한하는 조례를 내는 사례가 급증(소매·운수·요식 등). 기존 노동법전에는 '연방' 제한만 해고 사유였고 지역 제한은 근거가 없던 공백을 메움.", "whatChanged": "지역 정부의 외국인 고용 제한 조례도 외국인 근로계약 해지의 법적 근거가 됨. 소매판매 직종은 여러 지역에서 외국인 고용 금지 대상이 되는 추세라 유통·판매 법인에 직접 영향 가능.", "penalty": "지역 제한 초과 고용 시 КоАП/Admin. Offenses Code 18.15조 — 법인 벌금 건당 최대 80만~100만₽(지역별 상이) + 활동정지 리스크.", "hrChecklist": ["모스크바 및 사업 지역의 외국인 고용 제한 업종 목록 확인 (매년 갱신됨)", "고용 중인 CIS 국적 직원(판매·물류 등)의 직종 코드가 제한 대상인지 점검", "제한 대상 발견 시 직무 전환 또는 적법 해지 절차를 노무 자문과 진행 (일방 해고 아닌 법정 절차 준수)"], "internalDocs": ["외국인 직원 명부", "직제표(직종 코드)"], "process": "매년 12월 지역 조례 발표 시점에 제한 목록 점검 → 해당자 있으면 2개월 내 조치 계획 수립 → 본사 보고", "glossary": [{"term": "субъект РФ", "ko": "러시아 연방주체(지역) — 주지사령으로 외국인 고용 제한 가능", "en": "federal subject (region)"}], "sources": ["https://easydocs.ru/journal/pravo/izmeneniya_v_rabote_s_inostrannymi_grazhdanami_v_2026"], "titleEn": "Law 419-FZ of Nov 17, 2025 — amendment to Art. 327.6 (foreign staff dismissal)", "i18n": {"en": {"background": "A growing number of Russian regions are issuing decrees banning or restricting foreign employment in specific industries (retail, transport, food service, etc.). Previously the Labor Code only recognized federal-level restrictions as dismissal grounds, leaving no basis for regional restrictions — this closes that gap.", "whatChanged": "Regional government decrees restricting foreign employment are now a valid legal basis for terminating a foreign employee's contract. Retail sales roles are increasingly targeted for foreign-employment bans in multiple regions, which can directly affect distribution/retail companies.", "penalty": "Exceeding regional restrictions triggers Administrative Offenses Code Art. 18.15 — a company fine of up to RUB 800K-1M per case (varies by region) plus risk of business suspension.", "process": "Check the restricted-industry list when regional decrees are published each December → if affected employees are found, develop an action plan within 2 months → report to headquarters.", "hrChecklist": ["Check the list of industries restricted for foreign employment in Moscow and other operating regions (updated annually)", "Check whether the job codes of employed CIS-national staff (sales, logistics, etc.) fall under a restriction", "If a restricted role is found, work with a labor advisor on a role transfer or lawful termination process (not a unilateral dismissal — follow statutory procedure)"], "internalDocs": ["Foreign employee register", "Staffing table (job codes)"]}, "ru": {"background": "Всё больше регионов РФ вводят постановления, запрещающие или ограничивающие привлечение иностранных работников в отдельных отраслях (розница, транспорт, общепит и др.). Ранее ТК РФ признавал основанием для увольнения только федеральные ограничения, для региональных оснований не было — этот пробел устранён.", "whatChanged": "Постановления региональных властей об ограничении привлечения иностранной рабочей силы теперь являются законным основанием для расторжения трудового договора с иностранным работником. Розничные продажи всё чаще подпадают под запрет на иностранных работников в разных регионах, что может напрямую затронуть компании из сферы дистрибуции и розницы.", "penalty": "Превышение региональных ограничений влечёт ответственность по ст. 18.15 КоАП РФ — штраф для юрлица до 800 тыс.-1 млн ₽ за случай (зависит от региона) и риск приостановки деятельности.", "process": "Проверять список ограниченных отраслей при публикации региональных постановлений (обычно в декабре) → при выявлении затронутых сотрудников разработать план действий в течение 2 месяцев → доложить головному офису.", "hrChecklist": ["Проверить перечень отраслей, ограниченных для иностранных работников в Москве и других регионах присутствия (обновляется ежегодно)", "Проверить, подпадают ли должностные коды работающих сотрудников из стран СНГ (продажи, логистика и т.д.) под ограничение", "При обнаружении ограниченной должности провести с юристом процедуру перевода или законного расторжения договора (не одностороннее увольнение, а установленная законом процедура)"], "internalDocs": ["Реестр иностранных сотрудников", "Штатное расписание (коды должностей)"]}}}, {"id": "LAB-011", "category": "외국인·주재원", "titleKo": "2026년 외국인 고용 요건 — 쿼터 확대·ВКС(주재원) 요건 유지", "titleRu": "Квота на 2026 (ПП № 1920), ВКС 750 тыс ₽/квартал", "status": "시행중", "impact": "High", "effectiveDate": "2026-01-01", "background": "비자 발급 대상 외국인 노동자 쿼터가 2026년 278,940명으로 18.7% 확대(2025-11-28 정부령 1920호). 한국인 주재원은 통상 쿼터 면제인 ВКС/VKS/HQS 제도로 근무.", "whatChanged": "① 비자 쿼터 확대 (단, 한국인 주재원은 ВКС라 직접 영향 적음), ② ВКС 급여 요건: 분기당 75만 루블 이상 유지 필수, ③ 모든 외국인 직원 SNILS(사회보험번호) 의무, ④ 외국인 채용·건강검진·등록 관련 요건 지속 강화 추세.", "penalty": "ВКС 급여 요건 미달 분기 발생 시 워크퍼밋 취소 사유 + 향후 ВКС 채용 자격 제한(2년). 통지 의무(분기 급여 보고) 미이행 시 법인 벌금 최대 100만₽.", "hrChecklist": ["주재원 전원의 분기별 급여가 75만₽ 이상인지 확인 — 환율 변동·무급휴가 시 미달 위험 주의", "ВКС 분기 급여 보고(МВД 제출)가 기한 내 이뤄지는지 확인 (분기 종료 후 익월 말일까지)", "주재원 교체 시 워크퍼밋·비자·입국 등록·SNILS 일정을 역산한 체크리스트 운영", "가족 동반 비자·MVD 등록(도착 통지) 갱신 일정 관리"], "internalDocs": ["주재원 관리 대장", "ВКС 분기 보고 일정표"], "process": "분기 마감 전 급여 요건 확인(회계법인) → МВД/MVD 보고 → 미달 위험 시 본사와 급여 조정 협의", "glossary": [{"term": "SNILS", "ko": "사회보험 개인번호 — 외국인 포함 전 직원 필수", "en": "social insurance number"}, {"term": "МВД", "ko": "내무부 — 이주 관리 담당 기관", "en": "MVD — Ministry of Internal Affairs"}], "sources": ["https://easydocs.ru/journal/pravo/izmeneniya_v_rabote_s_inostrannymi_grazhdanami_v_2026", "https://www.gazeta-unp.ru/articles/53099-priem-inostrannyh-grajdan-na-rabotu-instruktsiya"], "titleEn": "2026 work-visa quota (Gov. Decree No. 1920), HQS salary RUB 750k/quarter", "i18n": {"en": {"background": "The visa-based foreign worker quota for 2026 was expanded 18.7% to 278,940 people (Government Decree No. 1920 of Nov 28, 2025). Korean expatriates typically work under the VKS (HQS) scheme, which is quota-exempt.", "whatChanged": "① The visa quota was expanded (though this has little direct effect on Korean expatriates since VKS is quota-exempt). ② VKS salary requirement: must maintain at least RUB 750,000 per quarter. ③ SNILS (social insurance number) is now mandatory for all foreign employees. ④ Requirements around foreign hiring, medical exams, and registration continue to tighten.", "penalty": "Falling short of the VKS salary requirement in any quarter is grounds for work-permit revocation plus a 2-year restriction on future VKS hiring eligibility. Failing to submit the mandatory quarterly salary report can result in a company fine of up to RUB 1 million.", "process": "Verify the salary requirement before quarter-end (with your accounting firm) → report to the MVD → if there is a shortfall risk, discuss a salary adjustment with headquarters.", "hrChecklist": ["Confirm every expatriate's quarterly salary is at least RUB 750,000 — watch for shortfall risk from exchange-rate swings or unpaid leave", "Confirm the mandatory quarterly VKS salary report (submitted to the MVD) is filed on time (by the end of the month following quarter-end)", "Run a reverse-scheduled checklist for work permit / visa / entry registration / SNILS whenever rotating an expatriate", "Manage the renewal schedule for family-accompanying visas and MVD registration (arrival notification)"], "internalDocs": ["Expatriate management register", "VKS quarterly reporting schedule"]}, "ru": {"background": "Квота на привлечение иностранных работников по визе на 2026 год увеличена на 18,7% до 278 940 человек (Постановление Правительства № 1920 от 28.11.2025). Корейские командированные сотрудники обычно работают по статусу ВКС, который не подпадает под квоту.", "whatChanged": "① Расширена визовая квота (хотя это мало влияет напрямую на корейских командированных, так как ВКС не подпадает под квоту). ② Требование к зарплате ВКС: не менее 750 000 ₽ в квартал. ③ SNILS обязателен теперь для всех иностранных работников. ④ Требования к найму иностранцев, медосмотрам и регистрации продолжают ужесточаться.", "penalty": "Несоблюдение требования к зарплате ВКС хотя бы в одном квартале — основание для аннулирования разрешения на работу и ограничения права найма ВКС на 2 года. Непредставление обязательного квартального отчёта о зарплате — штраф для юрлица до 1 млн ₽.", "process": "Перед окончанием квартала проверить соблюдение требования к зарплате (совместно с бухгалтерией) → подать отчёт в МВД → при риске недостижения обсудить корректировку зарплаты с головным офисом.", "hrChecklist": ["Убедиться, что квартальная зарплата каждого командированного сотрудника не менее 750 000 ₽ — учитывать риск недостижения из-за курсовых колебаний или неоплачиваемого отпуска", "Проверить своевременность подачи обязательного квартального отчёта о зарплате ВКС в МВД (до конца месяца, следующего за кварталом)", "При ротации командированного сотрудника вести чек-лист с обратным отсчётом сроков (разрешение на работу, виза, регистрация по прибытии, SNILS)", "Управлять графиком продления сопровождающих виз членов семьи и регистрации в МВД (уведомление о прибытии)"], "internalDocs": ["Реестр учёта командированных сотрудников", "График квартальной отчётности ВКС"]}}}, {"id": "LAB-012", "category": "외국인·주재원", "titleKo": "불법체류자 통제 레지스트리(РКЛ)·추방 레짐 — 채용 전 확인 의무화", "titleRu": "Реестр контролируемых лиц, режим высылки", "status": "시행중", "impact": "Medium", "effectiveDate": "2025-02-05", "background": "이주 통제 강화 정책. 불법체류 상태의 외국인을 МВД/MVD 공개 데이터베이스(레지스트리)에 등재하고, 등재자는 은행 거래 제한(월 3만₽)·창업 금지 등 권리가 제한되는 '추방 레짐' 적용.", "whatChanged": "고용주는 외국인과 근로계약 체결 전 РКЛ/RKL 등재 여부를 확인할 수 있고, 실무상 확인이 사실상 필수 절차가 됨(등재자 고용 시 불법고용 책임). 데이터는 4시간마다 갱신.", "penalty": "레지스트리 등재자(불법체류자) 고용 시 КоАП/Admin. Offenses Code 18.15조 불법고용 — 법인 벌금 건당 25만~80만₽(모스크바 최대 100만₽).", "hrChecklist": ["외국인 채용 절차에 'РКЛ 조회 → 결과 스크린샷 보관' 단계 공식 추가", "재직 중인 외국인 직원도 분기 1회 정기 조회 (체류 자격 상실 시 자동 등재됨)", "조회 기록을 인사파일에 보관해 실사(проверка/inspection) 대비"], "internalDocs": ["외국인 채용 체크리스트", "인사파일"], "process": "채용 전 МВД 사이트에서 조회 → 등재자면 채용 불가 → 재직자 등재 발견 시 즉시 노무 자문 협의(해지 절차)", "glossary": [{"term": "РКЛ", "ko": "통제대상자 레지스트리(Реестр контролируемых лиц) — МВД 공개 DB", "en": "RKL — Registry of Controlled Persons"}], "sources": ["https://all-migration.com/journal/migratsionnye-novosti-izmeneniya-v-zakonodatelstve-i-ne-tolko/rezhim-vysylki-i-reestr-kontroliruemykh-lits-kakie-posledstviya-dlya-inostrannykh-rabotnikov-i-rabot/", "https://www.finkont.ru/blog/reestr-kontroliruemykh-lits-dlya-inostrantsev-chto-vazhno-znat-rabotodatelyu-i-sotrudnikam/"], "titleEn": "Registry of Controlled Persons (RKL), expulsion regime", "i18n": {"en": {"background": "Part of tightened migration control. Foreign nationals staying illegally are entered in a public MVD database (registry); those listed fall under an \"expulsion regime\" restricting rights such as banking transactions (capped at RUB 30K/month) and starting a business.", "whatChanged": "Employers can check RKL status before signing an employment contract with a foreign national, and in practice this check has become essentially mandatory (hiring a listed person creates illegal-employment liability). Data is refreshed every 4 hours.", "penalty": "Employing someone listed in the registry (an illegal resident) triggers Administrative Offenses Code Art. 18.15 for illegal employment — a company fine of RUB 250K-800K per case (up to RUB 1M in Moscow).", "process": "Check the MVD website before hiring → cannot hire if listed → if a current employee is found listed, consult a labor advisor immediately on termination procedure.", "hrChecklist": ["Formally add an \"RKL check → keep a screenshot of the result\" step to the foreign-hiring process", "Run a quarterly recheck on current foreign employees too (status changes can trigger automatic listing)", "Keep the check records in the HR file to prepare for inspections"], "internalDocs": ["Foreign-hiring checklist", "HR file"]}, "ru": {"background": "Часть политики ужесточения миграционного контроля. Иностранцы, находящиеся в стране незаконно, вносятся в публичную базу данных МВД (реестр); для внесённых в реестр действует «режим высылки», ограничивающий права — банковские операции (не более 30 тыс. ₽/мес), запрет на создание бизнеса и др.", "whatChanged": "Работодатель может проверить статус в РКЛ до заключения трудового договора с иностранцем, и на практике эта проверка стала фактически обязательной (найм внесённого в реестр лица влечёт ответственность за незаконное привлечение к труду). Данные обновляются каждые 4 часа.", "penalty": "Найм лица, внесённого в реестр (незаконно находящегося в стране), влечёт ответственность по ст. 18.15 КоАП РФ за незаконное привлечение к трудовой деятельности — штраф для юрлица 250 тыс.-800 тыс. ₽ за случай (в Москве до 1 млн ₽).", "process": "Перед наймом проверить на сайте МВД → при наличии в реестре найм невозможен → при обнаружении действующего сотрудника в реестре немедленно проконсультироваться с юристом по процедуре расторжения.", "hrChecklist": ["Официально добавить в процесс найма иностранцев шаг «проверка РКЛ → сохранение скриншота результата»", "Проводить ежеквартальную повторную проверку и для действующих иностранных сотрудников (при утрате статуса возможно автоматическое внесение в реестр)", "Хранить записи проверок в личном деле для готовности к проверкам"], "internalDocs": ["Чек-лист найма иностранных сотрудников", "Личное дело сотрудника"]}}}, {"id": "LAB-013", "category": "병역·군동원", "titleKo": "병역 등록(воинский учёт) 의무 — 전자 레지스트리·벌금 최대 50만₽", "titleRu": "Воинский учёт, электронный реестр повесток", "status": "시행중", "impact": "High", "effectiveDate": "시행중 (통제 강화 지속)", "background": "모든 러시아 법인은 병역 대상 직원(18~30세 남성, 예비역, 군사특기 보유 여성 등)의 명부를 관리하고 군사위원회(военкомат/voenkomat)에 보고할 의무가 있음. 전자 소환장 레지스트리 가동 이후 военкомат·검찰·노동감독의 교차 점검이 일상화되고 벌금이 대폭 상향됨. 외국인 직원은 대상 아님.", "whatChanged": "① 소환장(повестка/summons)이 전자 레지스트리 등재만으로 송달 간주, ② 고용주는 병역 대상자의 채용·퇴직·정보 변경을 военкомат에 통보하고, 소환장 전달·출석 보장 의무, ③ 미이행 벌금: 담당자 4만~8만₽, 법인 최대 35만~50만₽ (출석 통지 미이행 등), ④ 500인 이상 사업장은 매년, 그 외는 3년마다 정기 점검.", "penalty": "법인 벌금 최대 50만₽ + 담당자 개인 벌금. 여러 기관이 중복 부과 가능.", "hrChecklist": ["병역 등록 담당자 지정 приказ/prikaz/order 존재 여부 확인 (러시아인 인사 담당자 지정 권장)", "병역 대상 직원 카드(форма 18/Form 18) 전수 작성·최신화", "채용·퇴직 시 военкомат 통보 프로세스(기한 5일)가 실제로 돌아가는지 점검", "법인 소재지 военкомат 등록 여부 확인 (미등록 법인 많음 — 대표적 적발 사유)", "동원 관련 상황 변화 시 즉시 본사 보고 라인 유지"], "internalDocs": ["병역 등록 담당자 지정 приказ", "форма 18 카드", "военкомат 서신 대장", "연간 계획서"], "process": "현황 감사(등록·카드·통보 이력) → 미비점 보완 → 담당자 교육 → 분기별 자체 점검. 민감 사안(동원 등)은 한국 본사 법무와 사전 협의된 대응 원칙 유지", "glossary": [{"term": "военкомат", "ko": "군사위원회 — 한국 병무청 지역사무소에 해당", "en": "voenkomat — military commissariat"}, {"term": "повестка", "ko": "소환장 — 전자 등재만으로 송달 효력 발생", "en": "povestka — summons"}], "sources": ["https://mos.legal/2026/02/15/voinskij-uchet-v-organizaczii-v-2026-godu-obyazannosti-rabotodatelya/", "https://www.kdelo.ru/art/386555-shtrafy-za-voinskiy-uchet"], "titleEn": "Military registration, electronic summons registry", "i18n": {"en": {"background": "Every Russian legal entity must maintain a roster of employees subject to military registration (men 18-30, reservists, women with a military specialty, etc.) and report to the local military commissariat (voenkomat). Since the electronic summons registry went live, cross-checks between the voenkomat, prosecutor's office, and labor inspectorate have become routine and fines have risen sharply. Foreign employees are not covered.", "whatChanged": "① A summons is now considered delivered simply by being entered in the electronic registry. ② Employers must notify the voenkomat of hiring, termination, and information changes for registrants, and must ensure summonses are delivered and attendance is guaranteed. ③ Fines for non-compliance: RUB 40K-80K for the responsible individual, up to RUB 350K-500K for the company. ④ Companies with 500+ employees are inspected annually; others every 3 years.", "penalty": "Company fines up to RUB 500,000 plus a separate personal fine for the responsible officer. Multiple agencies can impose overlapping fines.", "process": "Audit current status (registration, cards, notification history) → fix gaps → train the responsible person → self-check quarterly. For sensitive matters (mobilization, etc.), maintain a pre-agreed response protocol coordinated with Korean HQ legal.", "hrChecklist": ["Confirm an order formally appointing a military-registration officer exists (recommend appointing a Russian-national HR staff member)", "Ensure Form 18 cards are fully completed and up to date for every registration-eligible employee", "Verify the hiring/termination notification process to the voenkomat (5-day deadline) is actually being followed", "Confirm the company is registered with the voenkomat covering its registered address (many companies are found not to be — a common inspection finding)", "Maintain an immediate escalation line to Korean HQ for any change in mobilization-related circumstances"], "internalDocs": ["Order appointing the military-registration officer", "Form 18 cards", "Voenkomat correspondence register", "Annual plan document"]}, "ru": {"background": "Каждое юрлицо в России обязано вести учёт военнообязанных сотрудников (мужчины 18-30 лет, запасники, женщины с военно-учётной специальностью и др.) и отчитываться перед военкоматом. С запуском электронного реестра повесток перекрёстные проверки военкомата, прокуратуры и трудовой инспекции стали регулярными, а штрафы значительно выросли. Иностранные сотрудники учёту не подлежат.", "whatChanged": "① Повестка теперь считается врученной с момента внесения в электронный реестр. ② Работодатель обязан уведомлять военкомат о приёме, увольнении и изменении данных военнообязанных, а также обеспечивать вручение повесток и явку. ③ Штрафы за неисполнение: 40-80 тыс. ₽ для ответственного лица, до 350-500 тыс. ₽ для юрлица. ④ Компании со штатом от 500 человек проверяются ежегодно, остальные — раз в 3 года.", "penalty": "Штраф для юрлица до 500 000 ₽ плюс отдельный штраф для ответственного должностного лица. Несколько ведомств могут налагать штрафы одновременно.", "process": "Провести аудит текущего состояния (регистрация, карточки, история уведомлений) → устранить пробелы → обучить ответственное лицо → проводить самопроверку ежеквартально. По чувствительным вопросам (мобилизация и т.п.) придерживаться заранее согласованного с юротделом головного офиса протокола реагирования.", "hrChecklist": ["Проверить наличие приказа о назначении ответственного за воинский учёт (рекомендуется назначать сотрудника-гражданина РФ)", "Обеспечить полное и актуальное заполнение карточек формы №18 на всех военнообязанных сотрудников", "Проверить фактическую работу процесса уведомления военкомата о приёме/увольнении (срок 5 дней)", "Проверить постановку организации на учёт в военкомате по месту регистрации (многие компании не встают на учёт — частое основание для штрафа)", "Поддерживать канал немедленной эскалации в головной офис в Корее при изменении обстоятельств, связанных с мобилизацией"], "internalDocs": ["Приказ о назначении ответственного за воинский учёт", "Карточки формы №18", "Реестр переписки с военкоматом", "Годовой план мероприятий"]}}, "effectiveDateI18n": {"en": "Ongoing (enforcement continuing to tighten)", "ru": "Действует (контроль продолжает ужесточаться)"}}, {"id": "LAB-014", "category": "인사데이터", "titleKo": "직원 개인정보 처리 벌금 대폭 강화 — 유출 시 매출연동 벌금", "titleRu": "420-ФЗ — штрафы за персональные данные", "status": "시행중", "impact": "High", "effectiveDate": "2025-05-30", "background": "대규모 개인정보 유출 사건이 잇따르자 제재를 대폭 강화(2024-11-30 연방법 420-ФЗ, 2025-05-30 발효). 인사 데이터(직원·지원자 정보)도 전부 개인정보 규제 대상.", "whatChanged": "① 개인정보 처리 개시를 Роскомнадзор/Roskomnadzor에 미신고 시 벌금 10만~30만₽ (직원 1명만 있어도 신고 의무), ② 유출 시: 1천~1만명 규모 300만~500만₽, ③ 유출 후 24시간 내 미통보 100만~300만₽, ④ 대규모 유출 반복 시 매출연동 벌금 최대 5억₽.", "penalty": "위 벌금 체계 자체. HR 시스템·엑셀 파일 유출도 동일 적용.", "hrChecklist": ["법인의 Роскомнадзор 개인정보 처리자 신고(등록) 여부 즉시 확인 — 미등록이면 최우선 조치", "직원 개인정보 처리 동의서·개인정보규정(ЛНА/LNA) 현행화 (수집 항목·목적·보관기간 명시)", "인사 데이터의 러시아 내 서버 1차 저장(로컬라이제이션) 여부 확인 — 본사 HR 시스템으로 전송 시 국외이전 절차 필요", "유출 시 24시간 내 Роскомнадзор 통보하는 비상 대응 절차 문서화", "인사 데이터 접근 권한 최소화 + 담당자 지정 приказ/prikaz/order"], "internalDocs": ["개인정보 처리 규정", "직원 동의서 양식", "국외이전 관련 문서", "유출 대응 절차서"], "process": "IT·보안 담당(본인 부서 협업 포인트)과 데이터 흐름도 작성 → 법무 검토 → Роскомнадзор 신고 현행화 → 본사 HR 시스템 연동 구조 점검", "glossary": [{"term": "Роскомнадзор", "ko": "통신·개인정보 감독청", "en": "Roskomnadzor — data/comms authority"}, {"term": "локализация", "ko": "러시아인 개인정보의 러시아 내 서버 1차 저장 의무(152-ФЗ)", "en": "data localization"}], "sources": ["https://kontur.ru/kedo/spravka/53645-shtrafy_za_narushenie_zakona_o_pd", "https://e-kontur.ru/blog/16106/shtrafy-za-obrabotku-personalnykh-dannykh"], "titleEn": "Law 420-FZ — fines for personal data violations", "i18n": {"en": {"background": "A wave of large-scale personal-data breaches led to sharply tightened sanctions (Federal Law No. 420-FZ of Nov 30, 2024, effective May 30, 2025). HR data (employee and applicant information) is fully subject to personal-data regulation.", "whatChanged": "① Failing to notify Roskomnadzor of the start of personal-data processing carries a fine of RUB 100K-300K (notification is required even with just one employee). ② A breach affecting 1,000-10,000 people: RUB 3M-5M. ③ Failing to report a breach within 24 hours: RUB 1M-3M. ④ Repeated large-scale breaches: a revenue-linked fine of up to RUB 500M.", "penalty": "The fine schedule above applies directly. The same rules apply equally to a breach of an HR system or even a simple Excel file.", "process": "Map the data flow together with IT/security → have l
